name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@naucto'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD
        if: github.event_name == 'pull_request'
      - run: npm run docs:build
      # The submodule's own checks, here too: a broken link or an undocumented parameter in the
      # docs is a broken page in this app.
      - run: npm run docs:check
      - run: npm run format:check
      - run: npm run lint
      # Catches a regenerate that lost the design's glyph overrides, which would otherwise put
      # every one of them back to its pixelarticons lookalike under the same name, silently.
      - run: npm run icons:check
      - run: npm run typecheck
      # The Backend's contract is the one this app is built from, and it lives in another repository
      # whose own drift check only compares it with itself. This is what notices a DTO or a status
      # code changing there while the copy here is left behind — which happened three times over.
      #
      # The Backend's contract lives only on the branch the pair is developed on — its default
      # branch has no swagger.json at all — so which ref is read here decides whether this check
      # runs or fails for a reason that has nothing to do with the Frontend.
      #
      # A branch name spelled into this file rots the day it is merged, and a repository variable
      # goes stale just as quietly. So the Backend branch of the same name is preferred, which
      # follows the pair wherever it goes, and the variable is only a fallback for the cases where
      # that guess is wrong. Every step below says which ref it used.
      - name: Decide which Backend branch the contract comes from
        id: contract-ref
        env:
          # head_ref, not ref_name: on a pull_request the ref_name is "<n>/merge", which is no
          # branch in the Backend at all, so the lookup could never match; on a push it is the branch
          # being pushed to, which for a release is the default branch that carries no contract.
          # head_ref is the branch the work is on in both cases, and empty outside a pull request.
          THIS_BRANCH: ${{ github.head_ref || github.ref_name }}
          OVERRIDE: ${{ vars.BACKEND_CONTRACT_REF }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Asked of the contents API rather than of git, because what matters is whether the file
          # is on that ref, and listing a tree means fetching it. A 404 is the answer "no contract
          # there" — which includes a branch that does not exist, so one call covers both.
          has_contract() {
            # No token on a public repository is fine; an empty one is not, and asking with an
            # empty bearer gets 401 rather than the answer.
            if [ -n "${GH_TOKEN:-}" ]; then
              curl -fs -o /dev/null -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/Naucto/Backend/contents/swagger.json?ref=$1"
            else
              curl -fs -o /dev/null \
                "https://api.github.com/repos/Naucto/Backend/contents/swagger.json?ref=$1"
            fi
          }
          ref=""
          for candidate in "$THIS_BRANCH" "$OVERRIDE"; do
            if [ -n "$candidate" ] && has_contract "$candidate"; then ref="$candidate"; break; fi
          done
          if [ -z "$ref" ]; then
            echo "No branch of Naucto/Backend carries swagger.json that this job can read." >&2
            echo "Looked for a branch named '$THIS_BRANCH' and for BACKEND_CONTRACT_REF='$OVERRIDE'." >&2
            echo "Push the contract to a matching branch, or point the variable at one that has it." >&2
            exit 1
          fi
          echo "Reading the contract from Naucto/Backend@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # Not continue-on-error. A contract that cannot be fetched fails this step, and that is the
      # point: a guard that stops running when the Backend branch moves leaves drift exactly as
      # unnoticed as it did before the guard existed, while still showing a green job.
      - uses: actions/checkout@v5
        with:
          repository: Naucto/Backend
          ref: ${{ steps.contract-ref.outputs.ref }}
          path: Backend
          # A file at the root, which is not what cone mode selects: cone mode is for directories.
          sparse-checkout: swagger.json
          sparse-checkout-cone-mode: false
      - name: The API contract matches the Backend's
        run: node tools/contract-check.mjs
        env:
          NAUCTO_BACKEND_CONTRACT: ${{ github.workspace }}/Backend/swagger.json
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@naucto'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run docs:build
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: naucto/frontend:ci
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
