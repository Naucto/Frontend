name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@naucto'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD
        if: github.event_name == 'pull_request'
      - run: npm run docs:build
      # The submodule's own checks, here too: a broken link or an undocumented parameter in the
      # docs is a broken page in this app.
      - run: npm run docs:check
      - run: npm run format:check
      - run: npm run lint
      # Catches a regenerate that lost the design's glyph overrides, which would otherwise put
      # every one of them back to its pixelarticons lookalike under the same name, silently.
      - run: npm run icons:check
      - run: npm run typecheck
      # The Backend's contract is the one this app is built from, and it lives in another repository
      # whose own drift check only compares it with itself. This is what notices a DTO or a status
      # code changing there while the copy here is left behind — which happened three times over.
      #
      # The two branches move together, so the ref is a variable rather than a commit: point it at
      # whatever the Backend side of the pair is on. If the contract cannot be fetched the check says
      # so and moves on; drift itself always fails.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: Naucto/Backend
          ref: ${{ vars.BACKEND_CONTRACT_REF || 'feat/naucto-ai' }}
          path: Backend
          sparse-checkout: swagger.json
      - name: The API contract matches the Backend's
        run: node tools/contract-check.mjs
        env:
          NAUCTO_BACKEND_CONTRACT: ${{ github.workspace }}/Backend/swagger.json
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@naucto'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run docs:build
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: naucto/frontend:ci
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
