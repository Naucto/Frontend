networks:
  # Created by the Backend dev stack, which dev.sh already requires to be running.
  naucto-dev:
    external: true

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # `--` is required, otherwise npm swallows --host instead of passing it to vite.
    command: npm run dev -- --host
    environment:
      VITE_BACKEND_PORT: ${VITE_BACKEND_PORT:-3000}
    networks:
      - naucto-dev
    ports:
      - "${FRONTEND_PORT:-3001}:5173"
    develop:
      watch:
        - action: rebuild
          path: package.json

        - action: rebuild
          path: vite.config.ts

        - action: rebuild
          path: tsconfig.json

        - action: rebuild
          path: tsconfig.paths.json

        - action: sync
          path: src/
          target: /app/src

        - action: sync
          path: public/
          target: /app/public
