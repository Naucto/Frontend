server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The engine's synth runs in an AudioWorklet loaded from a blob: URL; WebGL needs no exception.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss: ws:; media-src 'self' blob:; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Runtime configuration, written at container start: never cache it.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Immutable is a promise about the *name*, not about the kind of file: it says this URL will
    # never mean anything else. Only the build's own output can promise that, because only it carries
    # a content hash -- main-YXQYP76H.js, styles-C7GFKETD.css.
    # Quoted: an unquoted brace is nginx's own block syntax, not the regex's.
    location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything copied verbatim out of apps/web/public/ keeps its name for ever: the translation
    # catalogue, the fonts, the mark, the built docs index. Matching those on their extension is what
    # handed a browser /i18n/en.json for a year -- so every string added after its first visit was
    # painted as the name of its own key, and no deployment could reach it. They revalidate; an
    # unchanged file costs a 304.
    location ~* \.(?:json|ttf|woff2?|png|svg|ico|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
