server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The engine's synth runs in an AudioWorklet loaded from a blob: URL; WebGL needs no exception.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss: ws:; media-src 'self' blob:; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Runtime configuration, written at container start: never cache it.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    location = /docs/index.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets are immutable.
    location ~* \.(?:js|css|ttf|woff2?|png|svg|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
