server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # nginx inherits add_header only into a block that declares none, so every block that adds its
    # own includes these again.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Runtime configuration, written at container start: never cache it.
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Only content-hashed build output may be immutable; the pattern is quoted because a bare brace is nginx block syntax.
    location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Files copied verbatim from apps/web/public keep their names across deployments, so they revalidate.
    location ~* \.(?:json|ttf|woff2?|png|svg|ico|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
