server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app uses BrowserRouter, so unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build output, never cache the entry HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
