<div
  class="flex touch-none items-center justify-between gap-2 select-none"
  [class]="
    overlay()
      ? 'pointer-events-none absolute inset-0 p-2'
      : 'w-full bg-panel px-2 py-2 pb-[max(16px,env(safe-area-inset-bottom))]'
  "
  role="group"
  [attr.aria-label]="'game.screen.pad.label' | transloco"
  [style.--nc-pad-scale]="settings.scale()"
  [style.opacity]="overlay() ? settings.opacity() / 100 : 1">
  <div class="pointer-events-auto grid grid-cols-3 grid-rows-3 gap-0.5">
    @for (arm of cross(); track arm.control) {
      <button
        type="button"
        [class]="key + ' ' + arm.at"
        [attr.data-nc-control]="arm.control"
        [attr.aria-label]="'game.screen.pad.' + arm.label | transloco">
        <nc-mark [name]="arm.mark" />
      </button>
    }
    @if (cross().length) {
      <span
        class="col-start-2 row-start-2 h-[calc(56px*var(--nc-pad-scale,1))] w-[calc(56px*var(--nc-pad-scale,1))] bg-line/40"></span>
    }
  </div>

  @if (controls().includes('start')) {
    <button
      type="button"
      class="pointer-events-auto self-end"
      [class]="start"
      data-nc-control="start">
      {{ 'input.pad.start' | transloco }}
    </button>
  }

  <div class="pointer-events-auto grid grid-cols-3 grid-rows-3 gap-0.5">
    @for (button of faces(); track button.control) {
      <button
        type="button"
        [class]="face + ' ' + button.at"
        [attr.data-nc-control]="button.control">
        {{ button.legend }}
      </button>
    }
    @if (faces().length) {
      <span
        class="col-start-2 row-start-2 h-[calc(56px*var(--nc-pad-scale,1))] w-[calc(56px*var(--nc-pad-scale,1))]"></span>
    }
  </div>
</div>
