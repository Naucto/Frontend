<a [routerLink]="link()" class="group block">
  <div
    class="raised-lg bevel-level group-hover:bevel-lift group-hover:bevel-lit group-focus-visible:bevel-lift group-focus-visible:bevel-lit group-active:bevel-down"
    [class]="
      ghost()
        ? 'bevel-edge-line-strong bevel-fill-transparent group-hover:bevel-fill-inset group-focus-visible:bevel-fill-inset'
        : 'bevel-fill-inset'
    ">
    <div class="relative overflow-hidden" [style.aspect-ratio]="COVER_RATIO">
      <ng-content select="[cover]" />
      <div
        class="absolute inset-x-0 bottom-0 flex h-[24px] items-center gap-[8px] overflow-hidden bg-page/85 px-[6px] empty:hidden">
        <ng-content select="[info]" />
      </div>
      @if (action() !== 'none') {
        <span
          class="raised-sm absolute inset-0 m-auto inline-flex h-(--nc-h-md) w-fit items-center gap-1 px-[14px] font-ui text-small tracking-button whitespace-nowrap uppercase transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
          [class.opacity-0]="!ghost()"
          [class]="action() === 'play' ? 'bevel-hot text-on-hot' : 'bevel-primary text-on-primary'">
          <nc-icon [name]="ACTION_ICON[action()]" [size]="24" />
          {{ actionLabel() }}
        </span>
      }
    </div>
  </div>
  <div
    class="mt-[10px] truncate text-center text-ui text-ink group-hover:text-gold-ink group-focus-visible:text-gold-ink">
    {{ name() }}
  </div>
  <ng-content select="[meta]" />
</a>
