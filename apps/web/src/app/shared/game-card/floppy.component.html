<div class="stage" [class.is-ghost]="ghost()">
  <div #disk class="tilt">
    <div class="glow">
      <div class="shell">
        <div class="face">
          <span class="window"></span>
          <span class="shutter"></span>
          <div class="label" [class.no-cover]="!cover()">
            @if (cover(); as src) {
              <img [src]="src" alt="" class="pixelated" loading="lazy" />
            } @else if (mode() === 'title') {
              <nc-icon
                name="image"
                [size]="24"
                class="absolute inset-0 m-auto size-[24px] text-ink-4" />
            }
            @if (preview(); as clip) {
              <video #video [src]="clip" [muted]="true" loop playsinline preload="none"></video>
            }
            @if (mode() === 'title') {
              <div class="band">
                <ng-content select="[info]" />
              </div>
            }
          </div>
          <span class="light"></span>
        </div>
      </div>
    </div>
    @if (mode() === 'title' && action() !== 'none') {
      <span
        class="action raised-sm inline-flex h-(--nc-h-md) items-center gap-1 px-[14px] font-ui text-small tracking-button whitespace-nowrap uppercase"
        [class]="action() === 'play' ? 'bevel-hot text-on-hot' : 'bevel-primary text-on-primary'">
        <nc-icon [name]="ACTION_ICON[action()]" [size]="24" />
        {{ actionLabel() }}
      </span>
    }
  </div>
</div>
@if (mode() === 'title') {
  <div #title class="title text-ui text-ink" [class.text-center]="titleAlign() === 'center'">
    <span>{{ name() }}</span>
  </div>
  <ng-content select="[meta]" />
}
