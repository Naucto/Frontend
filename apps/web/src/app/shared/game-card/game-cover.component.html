@if (url(); as src) {
  <img
    [src]="src"
    [alt]="alt()"
    class="pixelated h-full w-full"
    [class]="fit() === 'contain' ? 'object-contain' : 'object-cover'"
    loading="lazy" />
} @else {
  <span class="no-cover flex h-full w-full flex-col items-center justify-center gap-0.5 text-ink-4">
    <nc-icon name="image" [size]="24" />
    @if (label()) {
      <span class="label text-micro">{{ label() }}</span>
    }
  </span>
}
