@if (auth.suspension()) {
  <nc-notice *transloco="let t" variant="band" tone="danger" data-testid="suspension-band">
    {{
      until()
        ? t('moderation.suspended.until', { until: until() })
        : t('moderation.suspended.indefinite')
    }}
    {{ t('moderation.suspended.rule') }}
  </nc-notice>
}
