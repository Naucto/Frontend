<nc-dialog-shell
  *transloco="let t"
  [title]="t('moderation.report.title.' + data.targetType)"
  [lead]="data.author ? undefined : data.label"
  [closeLabel]="t('feedback.close')">
  <form class="flex flex-col gap-[14px]" (submit)="$event.preventDefault(); send()">
    @if (data.author; as author) {
      <figure class="flex gap-1.5 flat-sm bevel-edge-line-strong bevel-fill-inset p-1.5">
        <nc-user-avatar class="shrink-0" [userId]="author.id" [name]="author.name" [size]="24" />
        <div class="min-w-0">
          <figcaption class="text-meta text-ink-3">{{ author.name }}</figcaption>
          <p class="line-clamp-3 text-small whitespace-pre-wrap wrap-anywhere text-ink-body">
            {{ data.label }}
          </p>
        </div>
      </figure>
    }
    <nc-field [label]="t('moderation.report.reason')" for="flag-reason">
      <nc-select
        inputId="flag-reason"
        [options]="reasons()"
        [placeholder]="t('moderation.report.pickReason')"
        [value]="reason() ?? undefined"
        (valueChange)="reason.set($event ?? null)" />
    </nc-field>

    <nc-field
      [label]="t('moderation.report.details')"
      for="flag-details"
      [hint]="t('moderation.report.detailsHint')"
      [counter]="t('moderation.report.count', { n: details().length, max: detailsMax })">
      <textarea
        ncInput
        id="flag-details"
        rows="4"
        class="w-full resize-y"
        [attr.maxlength]="detailsMax"
        [value]="details()"
        (input)="details.set($any($event.target).value)"></textarea>
    </nc-field>

    <p class="text-meta text-ink-3">{{ t('moderation.report.note') }}</p>

    @if (failed(); as message) {
      <nc-notice tone="danger">{{ message }}</nc-notice>
    }
  </form>
  <ng-container footer>
    <button ncButton variant="ghost" type="button" (click)="ref.close()">
      {{ t('feedback.cancel') }}
    </button>
    <button
      ncButton
      variant="primary"
      type="button"
      [disabled]="reason() === null || pending()"
      (click)="send()">
      {{ pending() ? t('feedback.sending') : t('moderation.report.send') }}
    </button>
  </ng-container>
</nc-dialog-shell>
