<nc-dialog-shell
  *transloco="let t"
  [title]="t('moderation.report.title.' + data.targetType)"
  [lead]="data.label"
  [closeLabel]="t('feedback.close')">
  <form class="flex flex-col gap-[14px]" (submit)="$event.preventDefault(); send()">
    <nc-field [label]="t('moderation.report.reason')">
      <div
        role="group"
        class="flex flex-wrap gap-[6px]"
        [attr.aria-label]="t('moderation.report.reason')">
        @for (option of reasons(); track option.value) {
          <nc-toggle-button
            [controlled]="true"
            [checked]="option.value === reason()"
            (activated)="reason.set(option.value)">
            {{ option.label }}
          </nc-toggle-button>
        }
      </div>
    </nc-field>

    <nc-field
      [label]="t('moderation.report.details')"
      for="flag-details"
      [hint]="t('moderation.report.detailsHint')"
      [counter]="t('moderation.report.count', { n: details().length, max: detailsMax })">
      <textarea
        ncInput
        id="flag-details"
        rows="4"
        class="w-full resize-y"
        [attr.maxlength]="detailsMax"
        [value]="details()"
        (input)="details.set($any($event.target).value)"></textarea>
    </nc-field>

    <p class="text-meta text-ink-3">{{ t('moderation.report.note') }}</p>

    @if (failed(); as message) {
      <nc-notice tone="danger">{{ message }}</nc-notice>
    }
  </form>
  <ng-container footer>
    <button ncButton variant="ghost" type="button" (click)="ref.close()">
      {{ t('feedback.cancel') }}
    </button>
    <button
      ncButton
      variant="primary"
      type="button"
      [disabled]="reason() === null || pending()"
      (click)="send()">
      {{ pending() ? t('feedback.sending') : t('moderation.report.send') }}
    </button>
  </ng-container>
</nc-dialog-shell>
