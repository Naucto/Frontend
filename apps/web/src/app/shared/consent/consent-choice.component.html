<nc-setting-row
  *transloco="let t"
  icon="eye"
  [title]="t('consent.choiceTitle')"
  [hint]="t('consent.choiceHint')">
  <nc-toggle
    [label]="t('consent.choiceTitle')"
    [checked]="consent.status() === 'granted'"
    (checkedChange)="$event ? consent.grant() : consent.deny()" />
</nc-setting-row>
