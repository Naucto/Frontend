<nc-dialog-shell
  *transloco="let t"
  [title]="t('feedback.bug.title')"
  [lead]="t('feedback.bug.lead')"
  [closeLabel]="t('feedback.close')">
  <form
    class="-mr-1 flex max-h-[calc(100dvh-240px)] flex-col gap-[14px] overflow-y-auto pr-1"
    (submit)="$event.preventDefault(); send()"
    (keydown)="onKey($event)">
    <nc-field [label]="t('feedback.bug.category')" for="bug-category">
      <nc-select inputId="bug-category" [options]="categories()" [(value)]="category" />
    </nc-field>

    <nc-field
      [label]="t('feedback.bug.summary')"
      for="bug-title"
      [counter]="title().length + '/' + titleMax">
      <input
        ncInput
        id="bug-title"
        class="w-full"
        autocomplete="off"
        [attr.maxlength]="titleMax"
        [placeholder]="t('feedback.bug.summaryPlaceholder')"
        [value]="title()"
        (input)="title.set($any($event.target).value)" />
    </nc-field>

    <nc-field
      [label]="t('feedback.bug.description')"
      for="bug-description"
      [hint]="t('feedback.bug.descriptionHint')"
      [counter]="description().length + '/' + descriptionMax">
      <textarea
        ncInput
        id="bug-description"
        rows="5"
        class="w-full resize-y"
        [attr.maxlength]="descriptionMax"
        [value]="description()"
        (input)="description.set($any($event.target).value)"></textarea>
    </nc-field>

    <nc-field
      [label]="t('feedback.bug.screenshot')"
      [hint]="t('feedback.bug.screenshotHint')"
      [error]="screenshotError() ?? undefined">
      <nc-media-frame
        fit="contain"
        [src]="preview()"
        [alt]="t('feedback.bug.screenshotAlt')"
        emptyIcon="camera"
        [emptyLabel]="preparing() ? t('feedback.bug.preparing') : t('feedback.bug.dropHint')"
        dropImages
        (imageDrop)="attach($event)">
        <ng-container actions>
          @if (hasFrame) {
            <button type="button" ncMediaAction [disabled]="preparing()" (click)="useFrame()">
              <nc-icon name="gamepad" />
              {{ t('feedback.bug.useFrame') }}
            </button>
          }
          @if (canCapture) {
            <button type="button" ncMediaAction [disabled]="preparing()" (click)="captureScreen()">
              <nc-icon name="camera" />
              {{ t('feedback.bug.captureScreen') }}
            </button>
          }
          <label ncMediaAction [class.pointer-events-none]="preparing()">
            <nc-icon name="upload" />
            {{ t('feedback.bug.chooseFile') }}
            <input
              type="file"
              accept="image/png,image/jpeg,image/webp,image/gif"
              class="sr-only"
              (change)="pickFile($event)" />
          </label>
          @if (preview()) {
            <button type="button" ncMediaAction tone="danger" (click)="removeScreenshot()">
              <nc-icon name="trash" />
              {{ t('feedback.bug.removeScreenshot') }}
            </button>
          }
        </ng-container>
      </nc-media-frame>
    </nc-field>

    <div>
      <button
        ncButton
        variant="ghost"
        size="sm"
        type="button"
        class="-ml-[12px]"
        aria-controls="bug-included"
        [attr.aria-expanded]="showIncluded()"
        (click)="showIncluded.set(!showIncluded())">
        <nc-mark [name]="showIncluded() ? 'chevron-up' : 'chevron-down'" />
        {{ t('feedback.bug.included.title') }}
      </button>
      @if (showIncluded()) {
        <dl
          id="bug-included"
          class="flat-sm mt-[6px] grid grid-cols-[auto_minmax(0,1fr)] gap-x-[14px] gap-y-[4px] bevel-fill-inset px-[12px] py-[10px] text-meta">
          @for (row of contextRows(); track row.label) {
            <dt class="text-ink-4">{{ row.label }}</dt>
            <dd class="font-mono break-words whitespace-pre-wrap text-ink-2">{{ row.value }}</dd>
          }
        </dl>
      }
    </div>

    @if (failed(); as message) {
      <nc-notice tone="danger">{{ message }}</nc-notice>
    }
  </form>
  <ng-container footer>
    <button ncButton variant="ghost" type="button" (click)="ref.close()">
      {{ t('feedback.cancel') }}
    </button>
    <button
      ncButton
      variant="primary"
      type="button"
      [disabled]="!valid() || pending() || preparing()"
      (click)="send()">
      {{ pending() ? t('feedback.sending') : t('feedback.bug.send') }}
    </button>
  </ng-container>
</nc-dialog-shell>
