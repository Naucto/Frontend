<nc-dialog-shell
  *transloco="let t"
  [title]="t('feedback.thanks.title')"
  [lead]="
    data.kind === 'bug'
      ? t('feedback.thanks.bugLead', { id: data.id })
      : t('feedback.thanks.ratingLead')
  "
  [closeLabel]="t('feedback.close')">
  @if (data.kind === 'bug' && data.screenshotRefused) {
    <nc-notice tone="warn" class="mb-[12px]">
      {{ t('feedback.thanks.screenshotRefused') }}
    </nc-notice>
  }
  <div class="flat-sm flex items-start gap-[12px] bevel-fill-inset px-[12px] py-[10px]">
    <nc-icon name="message" class="shrink-0 text-sky-ink" />
    <div class="flex min-w-0 flex-col gap-[10px]">
      <p class="text-body text-ink-2">{{ t('feedback.thanks.discord') }}</p>
      <a
        ncButton
        variant="secondary"
        size="sm"
        class="self-start"
        [href]="discord"
        target="_blank"
        rel="noopener noreferrer">
        {{ t('feedback.thanks.join') }}
        <nc-icon name="external-link" />
      </a>
    </div>
  </div>
  <ng-container footer>
    <button ncButton variant="primary" type="button" (click)="ref.close()">
      {{ t('feedback.thanks.ok') }}
    </button>
  </ng-container>
</nc-dialog-shell>
