<ng-container *transloco="let t">
  <span class="label truncate text-ink-3">{{ page().title }}</span>
  @if (current(); as current) {
    <span class="label shrink-0 text-ink-4">›</span>
    @if (current.kind === 'api') {
      <span class="min-w-0 truncate font-mono text-meta text-gold-ink">{{ current.title }}</span>
    } @else if (current.step) {
      <span class="label shrink-0 text-ink-3">
        {{ t('docs.stepOf', { n: current.step, m: current.steps }) }}
      </span>
      <span class="label min-w-0 truncate text-ink">{{ current.title }}</span>
      <span class="flex-1"></span>
      <span
        class="absolute -bottom-px left-0 h-[2px] bg-gold"
        [style.width.%]="(current.step / current.steps) * 100"></span>
      <button
        ncButton
        variant="ghost"
        size="sm"
        iconOnly
        [attr.aria-label]="t('docs.prevStep')"
        [disabled]="current.step <= 1"
        (click)="stepTo(current.step - 1)">
        <nc-icon name="chevron-left" [size]="24" />
      </button>
      <button
        ncButton
        variant="ghost"
        size="sm"
        iconOnly
        [attr.aria-label]="t('docs.nextStep')"
        [disabled]="current.step >= current.steps"
        (click)="stepTo(current.step + 1)">
        <nc-icon name="chevron-right" [size]="24" />
      </button>
    } @else {
      <span class="label min-w-0 truncate text-ink">{{ current.title }}</span>
    }
  }
</ng-container>
