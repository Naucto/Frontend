<nav *transloco="let t" [attr.aria-label]="t('docs.title')" class="text-meta">
  @for (section of docs.sections(); track section.id) {
    <button
      type="button"
      class="raised-sm active:bevel-down flex w-full cursor-pointer items-center text-left bevel-bare hover:bevel-lit hover:bevel-fill-raised hover:text-active-ink h-(--nc-h-md) gap-0.5 px-0.5 font-ui text-label tracking-label text-ink-3 uppercase"
      [attr.aria-expanded]="!collapsed().has(section.id)"
      (click)="toggle(section.id)">
      <nc-icon [name]="collapsed().has(section.id) ? 'chevron-right' : 'chevron-down'" />
      <nc-icon [name]="iconOf(section.id)" class="text-ink-4" />
      {{ t('docs.sections.' + section.id) }}
    </button>
    @if (!collapsed().has(section.id)) {
      @for (page of section.pages; track page.slug) {
        @if (!page.slug.endsWith('/index')) {
          <button
            type="button"
            class="raised-sm active:bevel-down flex w-full cursor-pointer items-center text-left h-(--nc-h-sm) gap-1 pr-1 pl-2"
            [class]="
              page.slug === active()
                ? 'bevel-lit text-active-ink'
                : 'text-ink-2 bevel-bare hover:bevel-lit hover:bevel-fill-raised hover:text-active-ink'
            "
            [attr.aria-current]="page.slug === active() ? 'page' : null"
            (click)="open.emit(page.slug)">
            <span class="min-w-0 flex-1 truncate">{{ page.title }}</span>
            @if (page.apis.length) {
              <span class="font-ui text-label tracking-label uppercase text-ink-4">
                {{ page.apis.length }} fn
              </span>
            }
          </button>
          @if (page.slug === active()) {
            @for (child of childrenOf(page); track child.id) {
              <button
                type="button"
                class="raised-sm active:bevel-down flex w-full cursor-pointer items-center text-left h-(--nc-h-xs) pr-1 text-label"
                [class]="
                  (child.id === fragment()
                    ? 'bevel-lit text-active-ink'
                    : 'text-ink-3 bevel-bare hover:bevel-lit hover:bevel-fill-raised hover:text-active-ink') +
                  (child.sub ? ' pl-5' : ' pl-3')
                "
                [attr.aria-current]="child.id === fragment() ? 'location' : null"
                (click)="open.emit(page.slug + '#' + child.id)">
                <span class="min-w-0 flex-1 truncate" [class.font-mono]="child.code">
                  {{ child.text }}
                </span>
              </button>
            }
          }
        }
      }
    }
  }
</nav>
