<nav *transloco="let t" [attr.aria-label]="t('docs.title')" class="text-meta">
  @for (section of docs.sections(); track section.id) {
    <nc-disclosure
      [title]="t('docs.sections.' + section.id)"
      [open]="!collapsed().has(section.id)"
      (openChange)="toggle(section.id)">
      <nc-icon lead [name]="iconOf(section.id)" class="text-ink-4" />
      @for (page of section.pages; track page.slug) {
        @if (!page.slug.endsWith('/index')) {
          <button
            type="button"
            [class]="
              ROW +
              ' h-(--nc-h-sm) gap-1 pr-1 pl-2 ' +
              (page.slug === active() ? CURRENT : 'text-ink-2')
            "
            [attr.aria-current]="page.slug === active() ? 'page' : null"
            (click)="open.emit(page.slug)">
            <span class="min-w-0 flex-1 truncate">{{ page.title }}</span>
            @if (page.apis.length) {
              <span class="font-ui text-label tracking-label text-ink-4 uppercase">
                {{ page.apis.length }} fn
              </span>
            }
          </button>
          @if (page.slug === active()) {
            @for (child of childrenOf(page); track child.id) {
              <button
                type="button"
                class="text-label"
                [class]="
                  ROW +
                  ' h-(--nc-h-xs) pr-1 ' +
                  (child.id === fragment() ? CURRENT : 'text-ink-3') +
                  (child.sub ? ' pl-5' : ' pl-3')
                "
                [attr.aria-current]="child.id === fragment() ? 'location' : null"
                (click)="open.emit(page.slug + '#' + child.id)">
                <span class="min-w-0 flex-1 truncate" [class.font-mono]="child.code">
                  {{ child.text }}
                </span>
              </button>
            }
          }
        }
      }
    </nc-disclosure>
  }
</nav>
