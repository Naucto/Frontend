<div
  *transloco="let t"
  role="toolbar"
  [attr.aria-label]="t('editor.transform.label')"
  class="flex items-center gap-0.5">
  <button
    ncButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="t('editor.transform.flipH')"
    (click)="flipH.emit()">
    <nc-mark name="flip-horizontal" />
  </button>
  <button
    ncButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="t('editor.transform.flipV')"
    (click)="flipV.emit()">
    <nc-mark name="flip-vertical" />
  </button>
  <button
    ncButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="t('editor.transform.rotateCw')"
    (click)="rotateCw.emit()">
    <nc-mark name="sync" />
  </button>
  <!-- The set draws one arrow; the other direction is the same glyph mirrored. -->
  <button
    ncButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="t('editor.transform.rotateCcw')"
    (click)="rotateCcw.emit()">
    <nc-mark name="sync" class="-scale-x-100" />
  </button>
</div>
