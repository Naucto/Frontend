<div role="radiogroup" [attr.aria-label]="label()" class="grid grid-cols-8 gap-0.5">
  @for (hex of colours(); track $index) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="$index === value()"
      [attr.aria-label]="'Colour ' + $index + ' ' + hex"
      [attr.tabindex]="$index === value() ? 0 : -1"
      [style.--bv-fill]="hex"
      (click)="value.set($index)"
      (keydown)="onKey($event)"
      class="h-(--nc-h-sm) cursor-pointer raised-sm hover:bevel-lit aria-checked:bevel-down aria-checked:bevel-lit"></button>
  }
</div>
