<nc-dialog-shell
  *transloco="let t"
  [title]="t(heading().title)"
  [lead]="heading().lead ? t(heading().lead!) : undefined">
  <nc-sign-in-form [next]="here" [(mode)]="mode" (succeeded)="ref.close(true)" />
  <button ncButton variant="ghost" footer (click)="ref.close(false)">
    {{ t('net.cancel') }}
  </button>
</nc-dialog-shell>
