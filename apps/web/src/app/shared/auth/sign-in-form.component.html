<ng-container *transloco="let t">
  <form class="grid gap-[14px]" (ngSubmit)="submit()" novalidate>
    @if (mode() === 'register') {
      <nc-field [label]="t('auth.username')" for="username">
        <input
          ncInput
          id="username"
          name="username"
          autocomplete="username"
          required
          minlength="3"
          [(ngModel)]="username" />
      </nc-field>
    }
    <nc-field [label]="t('auth.email')" for="email">
      <input
        ncInput
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [(ngModel)]="email" />
    </nc-field>
    <nc-field
      [label]="t('auth.password')"
      for="password"
      [hint]="mode() === 'register' ? passwordHint() : ''">
      <input
        ncInput
        id="password"
        name="password"
        type="password"
        [attr.autocomplete]="mode() === 'register' ? 'new-password' : 'current-password'"
        required
        [attr.minlength]="mode() === 'register' ? policy()?.minLength : null"
        [(ngModel)]="password" />
    </nc-field>
    <button
      ncButton
      variant="primary"
      size="lg"
      type="submit"
      class="mt-[6px] w-full"
      [disabled]="busy()">
      {{ mode() === 'register' ? t('auth.create') : t('auth.signIn') }}
    </button>
  </form>

  <div class="my-[18px] flex items-center gap-[12px]">
    <span class="h-[3px] flex-1 bg-line"></span>
    <span class="label text-ink-4">{{ t('auth.or') }}</span>
    <span class="h-[3px] flex-1 bg-line"></span>
  </div>
  <div class="grid grid-cols-1 gap-[10px] sm:grid-cols-3">
    @for (provider of providers(); track provider.flow.id) {
      <button
        ncButton
        variant="secondary"
        type="button"
        (click)="oauth(provider.flow)"
        [disabled]="busy() || !provider.configured"
        [attr.title]="provider.configured ? null : t('auth.notConfigured')">
        <nc-brand-mark [mark]="provider.flow.mark" [size]="24" />
        {{ provider.flow.label }}
      </button>
    }
  </div>

  <p class="mt-[22px] text-center text-meta text-ink-3">
    @if (mode() === 'login') {
      {{ t('auth.noAccount') }}
      <button
        type="button"
        class="cursor-pointer text-gold-ink decoration-3 underline-offset-[6px] hover:underline"
        (click)="register()">
        {{ t('auth.register') }}
      </button>
      {{ t('auth.takes20') }}
    } @else {
      {{ t('auth.haveAccount') }}
      <button
        type="button"
        class="cursor-pointer text-gold-ink decoration-3 underline-offset-[6px] hover:underline"
        (click)="mode.set('login')">
        {{ t('auth.signIn') }}
      </button>
    }
  </p>
</ng-container>
