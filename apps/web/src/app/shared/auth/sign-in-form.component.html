<ng-container *transloco="let t">
  <form class="grid gap-2" (ngSubmit)="submit()" novalidate>
    @if (mode() === 'register') {
      <nc-field [label]="t('auth.username')" for="username">
        <input
          ncInput
          id="username"
          name="username"
          autocomplete="username"
          required
          minlength="3"
          [(ngModel)]="username"
        />
      </nc-field>
    }
    <nc-field [label]="t('auth.email')" for="email">
      <input
        ncInput
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [(ngModel)]="email"
      />
    </nc-field>
    <nc-field
      [label]="t('auth.password')"
      for="password"
      [hint]="mode() === 'register' ? passwordHint() : ''"
    >
      <input
        ncInput
        id="password"
        name="password"
        type="password"
        [attr.autocomplete]="mode() === 'register' ? 'new-password' : 'current-password'"
        required
        [attr.minlength]="mode() === 'register' ? policy()?.minLength : null"
        [(ngModel)]="password"
      />
    </nc-field>
    <button
      ncButton
      variant="primary"
      size="lg"
      type="submit"
      class="mt-1 w-full"
      [disabled]="busy()"
    >
      {{ mode() === 'register' ? t('auth.create') : t('auth.signIn') }}
    </button>
  </form>

  <div class="my-2 flex items-center gap-2">
    <span class="h-px flex-1 bg-line-soft"></span>
    <span class="label text-ink-4">{{ t('auth.or') }}</span>
    <span class="h-px flex-1 bg-line-soft"></span>
  </div>
  <div class="grid grid-cols-1 gap-1 sm:grid-cols-3">
    @for (p of providers(); track p.flow.id) {
      <button
        ncButton
        variant="secondary"
        size="sm"
        type="button"
        class="h-[36px] text-ink-body"
        (click)="oauth(p.flow)"
        [disabled]="busy() || !p.configured"
        [attr.title]="p.configured ? null : t('auth.notConfigured')"
      >
        <nc-brand-mark [name]="p.flow.mark" [size]="12" />
        {{ p.flow.label }}
      </button>
    }
  </div>

  <p class="mt-3 text-center text-meta text-ink-3">
    @if (mode() === 'login') {
      {{ t('auth.noAccount') }}
      <button type="button" class="text-gold-ink hover:underline" (click)="register()">
        {{ t('auth.register') }}
      </button>
      {{ t('auth.takes20') }}
    } @else {
      {{ t('auth.haveAccount') }}
      <button type="button" class="text-gold-ink hover:underline" (click)="mode.set('login')">
        {{ t('auth.signIn') }}
      </button>
    }
  </p>
</ng-container>
