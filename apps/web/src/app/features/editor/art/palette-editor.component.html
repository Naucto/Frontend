<div class="flat-sm p-1.5">
  <div class="flex items-center gap-1">
    <span
      class="h-(--nc-h-sm) w-(--nc-h-sm) flat-sm bevel-edge-line-strong"
      [style.--bv-fill]="hex()"></span>
    <span class="font-mono text-meta text-ink">{{ slotLabel() }} {{ pad(slot()) }}</span>
    <input
      type="text"
      [value]="digits()"
      [attr.aria-label]="hexLabel()"
      maxlength="6"
      spellcheck="false"
      (change)="onHex($event)"
      class="ml-auto h-(--nc-h-sm) w-[calc(6ch+1.5rem)] well px-1 text-center font-mono text-meta text-ink outline-none not-focus:hover:bevel-lo-ink-4 focus:bevel-lo-active-ink" />
  </div>
  <div class="mt-1 grid gap-0.5">
    <nc-slider
      label="R"
      [max]="255"
      [value]="rgb()[0]"
      [readout]="String(rgb()[0])"
      accent="hot"
      compact
      (valueChange)="onChannel(0, $event)" />
    <nc-slider
      label="G"
      [max]="255"
      [value]="rgb()[1]"
      [readout]="String(rgb()[1])"
      accent="jade"
      compact
      (valueChange)="onChannel(1, $event)" />
    <nc-slider
      label="B"
      [max]="255"
      [value]="rgb()[2]"
      [readout]="String(rgb()[2])"
      accent="sky"
      compact
      (valueChange)="onChannel(2, $event)" />
  </div>
</div>
