<div class="sticky top-0 z-20 shrink-0 bg-panel" [style.height.px]="RULER_H"></div>
<div class="relative shrink-0" [style.height.px]="BED_H">
  @for (key of keys(); track key.pitch) {
    <button
      type="button"
      class="group absolute left-0 cursor-pointer text-left"
      [class]="
        key.black
          ? 'z-10 bg-key-sharp'
          : key.c
            ? 'w-full border-b-3 border-key-sharp bg-key-lit'
            : 'w-full border-b-3 border-key-sharp bg-key'
      "
      [style.top.px]="key.top"
      [style.height.px]="key.height"
      [style.width.px]="key.black ? BLACK_KEY_W : null"
      [attr.aria-label]="key.name"
      [attr.aria-pressed]="held() === key.pitch"
      [attr.data-pitch]="key.pitch"
      (pointerdown)="onDown($event, key.pitch)">
      @if (key.c) {
        <span class="absolute right-[4px] bottom-[2px] font-mono text-[9px] text-key-sharp">
          {{ key.name }}
        </span>
      }
      <span
        class="pointer-events-none absolute inset-0"
        [class]="held() === key.pitch ? 'bg-gold/45' : 'group-hover:bg-gold/20'"></span>
    </button>
  }
</div>
