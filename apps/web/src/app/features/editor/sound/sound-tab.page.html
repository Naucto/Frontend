<!-- The narrow instrument column is the least the banks' four-box grids need. -->
<div
  *transloco="let t"
  class="grid h-full grid-cols-[200px_minmax(0,1fr)_auto] min-[1280px]:grid-cols-[276px_minmax(0,1fr)_auto]">
  <!-- Scrolls as a whole: the banks keep a fixed height, so a short screen must not cut one of them
       mid-row. -->
  <aside class="flex min-h-0 flex-col overflow-y-auto border-r border-line bg-panel">
    <!-- A floor rather than nothing: left free to shrink it would give up every one of its
         rows to the banks below before the column ever scrolled. -->
    <nc-instrument-list
      class="min-h-[120px] flex-1"
      [list]="instrumentList()"
      [selectedId]="instrument()?.id ?? null"
      [palette]="palette()"
      [sfx]="library.sfx()"
      [patternId]="pattern()?.id ?? null"
      (selected)="sound.selectInstrument($event)"
      (add)="addInstrument()"
      (remove)="removeInstrument($event)"
      (duplicate)="duplicateInstrument($event)"
      (edit)="editInstrument($event)"
      (sfxToggle)="toggleSfx($event)" />
    <nc-song-list
      class="shrink-0"
      [slot]="sound.songSlot()"
      [song]="song()"
      [patterns]="library.patterns()"
      [playingIndex]="songPosition()"
      [playing]="playingWhat() === 'song'"
      (slotChange)="sound.selectSong($event)"
      (assign)="assignSongPlace($event)"
      (started)="playSong()"
      (paused)="pause()"
      (rewound)="songToStart()"
      (stopped)="stop()" />
  </aside>

  <!-- The container is the column and not the bar, because a container query answers to an
       ancestor: the bar's own height and wrapping have to be asked of the box around it. -->
  <section #column class="@container flex min-h-0 flex-col">
    @if (pattern(); as currentPattern) {
      <!-- Too narrow for one line, the bar takes a second row of its own height rather than
           wrapping inside the first. -->
      <header
        class="flex h-(--nc-bar-h) shrink-0 items-center gap-1 overflow-x-auto border-b border-line bg-panel px-2 @max-[780px]:h-[calc(2*var(--nc-bar-h))] @max-[780px]:flex-wrap @max-[780px]:content-start @max-[440px]:gap-0.5 @max-[440px]:px-1">
        <nc-number-field
          class="h-(--nc-transport-h) shrink-0"
          fill
          [label]="tightBar() ? '' : t('editor.sound.pattern')"
          [ariaLabel]="t('editor.sound.pattern')"
          [value]="currentPattern.slot"
          [max]="NO_CEILING"
          (requested)="sound.selectPattern($event)" />
        <button
          ncButton
          variant="ghost"
          size="sm"
          iconOnly
          [attr.aria-label]="t('editor.sound.clearPattern', { n: pad(currentPattern.slot) })"
          [disabled]="!currentPattern.notes.length"
          (click)="clearPattern()">
          <nc-icon name="trash" [size]="24" />
        </button>
        <span class="flex-1"></span>
        <nc-transport
          [playing]="playingWhat() === 'pattern'"
          [canRewind]="playhead() !== null"
          [canStop]="playing() || playhead() !== null"
          [playLabel]="t('editor.sound.play')"
          [pauseLabel]="t('editor.sound.pause')"
          [rewindLabel]="t('editor.sound.toStart')"
          [stopLabel]="t('editor.sound.stop')"
          (started)="play()"
          (paused)="pause()"
          (rewound)="toStart()"
          (stopped)="stop()" />
        <nc-toggle-button
          size="strip"
          [label]="t('editor.sound.loop')"
          [checked]="sound.loop()"
          (checkedChange)="setLoop($event)">
          <nc-icon name="repeat" [size]="24" />
          <span class="hidden @min-[900px]:inline">{{ t('editor.sound.loop') }}</span>
        </nc-toggle-button>
        <nc-toggle-button
          size="strip"
          [label]="t('editor.sound.metronome')"
          [checked]="sound.metronome()"
          (checkedChange)="sound.setMetronome($event)"
          accent="jade">
          <nc-icon name="metronome" [size]="24" />
          <span class="hidden @min-[900px]:inline">{{ t('editor.sound.metronome') }}</span>
        </nc-toggle-button>
        <!-- The spring between the two groups on one line; on two it is the line break,
             taking a whole line of no height so the number fields start the next. -->
        <span class="flex-1 @max-[780px]:basis-full"></span>
        <nc-number-field
          class="h-(--nc-transport-h) shrink-0"
          fill
          [label]="t('editor.sound.bpm')"
          [ariaLabel]="t('editor.sound.bpm')"
          [value]="currentPattern.bpm"
          [min]="BPM_MIN"
          [max]="BPM_MAX"
          (requested)="setBpm($event)" />
        <nc-number-field
          class="h-(--nc-transport-h) shrink-0"
          fill
          [label]="t('editor.sound.steps')"
          [ariaLabel]="t('editor.sound.steps')"
          [value]="currentPattern.steps"
          [min]="STEP_SIZE"
          [max]="STEP_MAX"
          [step]="STEP_SIZE"
          (requested)="setSteps($event)" />
        <button
          ncButton
          variant="ghost"
          [size]="tightBar() ? 'sm' : 'strip'"
          iconOnly
          [attr.aria-label]="t('editor.undo')"
          (click)="undo.manager.undo()"
          [disabled]="!undo.canUndo()">
          <nc-icon name="undo" [size]="24" />
        </button>
        <button
          ncButton
          variant="ghost"
          [size]="tightBar() ? 'sm' : 'strip'"
          iconOnly
          [attr.aria-label]="t('editor.redo')"
          (click)="undo.manager.redo()"
          [disabled]="!undo.canRedo()">
          <nc-icon name="redo" [size]="24" />
        </button>
      </header>
      <nc-piano-roll
        #roll
        class="min-h-0 flex-1"
        [pattern]="currentPattern"
        [instruments]="library.instruments()"
        [palette]="palette()"
        [instrumentId]="instrument()?.id ?? null"
        [snap]="sound.snap()"
        [zoom]="sound.zoom()"
        [playhead]="rollHead()"
        [collaborators]="presence.collaborators()"
        [label]="t('editor.sound.pianoRoll')"
        (notesChange)="setNotes(currentPattern, $event)"
        (audition)="audition($event)"
        (keyPressed)="holdKey($event)"
        (keyReleased)="releaseKey()"
        (pointer)="onPointer($event)"
        (seek)="onSeek($event)"
        (seekEnd)="onSeekEnd()" />
      <nc-voices-lane
        [pattern]="currentPattern"
        [instruments]="library.instruments()"
        [palette]="palette()"
        [stepWidth]="roll.stepW()"
        [scrollLeft]="roll.scrollX()"
        [playhead]="rollHead()"
        [active]="voices()"
        [label]="t('editor.sound.voices')" />
    } @else {
      <div class="flex flex-1 items-center justify-center">
        <nc-empty-state
          icon="music"
          [title]="t('editor.sound.emptyTitle')"
          [hint]="t('editor.sound.emptyHint')">
          <button ncButton variant="primary" (click)="addInstrument()">
            <nc-icon name="plus" [size]="12" />
            {{ t('editor.sound.addInstrument') }}
          </button>
        </nc-empty-state>
      </div>
    }
  </section>

  <nc-panel-column [width]="PANEL_WIDTH">
    <div actions class="flex min-w-0 flex-1 items-center gap-1">
      <!-- Controlled: a press means "next resolution", and only the store knows whether the result
           is still lit. -->
      <nc-toggle-button
        [controlled]="true"
        [checked]="sound.snap() !== 0"
        (activated)="cycleSnap()"
        [label]="t('editor.sound.snap')">
        <nc-icon name="grid" [size]="24" />
        {{ snapLabel(t('editor.sound.snap')) }}
      </nc-toggle-button>
      <nc-oscilloscope
        class="h-(--nc-control-h) w-[88px] shrink-0 border border-line"
        [peaks]="peaks"
        [label]="t('editor.sound.liveOut')" />
      <span class="flex-1"></span>
      <button
        ncButton
        variant="ghost"
        size="sm"
        iconOnly
        class="shrink-0"
        [attr.aria-label]="t('editor.sound.zoomOut')"
        (click)="stepZoom(-1)">
        <nc-icon name="zoom-out" [size]="24" />
      </button>
      <nc-slider
        class="w-[88px] min-w-[32px] shrink"
        [min]="0"
        [max]="1"
        [step]="0.001"
        [value]="zoomAt()"
        (valueChange)="setZoomAt($event)"
        [label]="t('editor.sound.zoom')"
        compact
        hideLabel />
      <button
        ncButton
        variant="ghost"
        size="sm"
        iconOnly
        class="shrink-0"
        [attr.aria-label]="t('editor.sound.zoomIn')"
        (click)="stepZoom(1)">
        <nc-icon name="zoom-in" [size]="24" />
      </button>
      <button
        type="button"
        class="control-type w-[38px] shrink-0 text-right font-mono text-ink-3 hover:text-ink"
        [attr.aria-label]="t('editor.sound.zoomReset')"
        (click)="sound.setZoom(1)">
        ×{{ zoomLabel() }}
      </button>
    </div>
    @if (instrument(); as inst) {
      <nc-instrument-inspector
        [inst]="inst"
        [palette]="palette()"
        [usedBy]="usedBy()"
        [samples]="library.samples()"
        (patched)="library.updateInstrument(inst.id, $event)"
        (sampleChange)="library.setInstrumentSample(inst.id, $event)" />
    } @else {
      <p class="label m-auto max-w-[220px] text-center text-ink-4">
        {{ t('editor.sound.noInstrument') }}
      </p>
    }
  </nc-panel-column>
</div>
