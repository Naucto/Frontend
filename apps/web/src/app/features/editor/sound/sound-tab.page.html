<ng-container *transloco="let t">
  @if (!isBase()) {
    <div
      class="flex h-(--nc-h-lg) shrink-0 items-center justify-end border-b-3 border-line bg-panel px-1">
      <button ncButton variant="ghost" size="sm" (click)="store.resetLayout()">
        <nc-mark name="dock" />
        {{ t('editor.sound.dock.reset') }}
      </button>
    </div>
  }
  @if (diff.on()) {
    <div class="shrink-0 border-b-3 border-line bg-panel">
      <nc-diff-changes [items]="soundChanges()" />
    </div>
  }
  <nc-dock-workspace
    class="min-h-0 flex-1"
    [windows]="windows()"
    [layout]="store.layout()"
    (layoutChange)="store.setLayout($event)"
    [active]="store.focus()"
    (activeChange)="setActive($event)"
    [marked]="deck.marked()"
    [labels]="labels()">
    <ng-template ncDockPane="timeline">
      <nc-timeline-editor />
    </ng-template>
    <ng-template ncDockPane="patterns">
      <nc-pattern-editor />
    </ng-template>
    <ng-template ncDockPane="instruments">
      <nc-instrument-editor />
    </ng-template>
    <ng-template ncDockPane="sfx">
      <nc-sfx-editor />
    </ng-template>
  </nc-dock-workspace>
</ng-container>
