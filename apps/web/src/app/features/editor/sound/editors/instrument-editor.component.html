<ng-container *transloco="let t">
  @if (!folded()) {
    <nc-instrument-list
      class="w-[200px] shrink-0 border-r-3 border-line bg-panel"
      [list]="deck.instrumentList()"
      [selectedId]="deck.instrument()?.id ?? null"
      [palette]="deck.palette()"
      [peersOf]="deck.instrumentPeers"
      (selected)="store.selectInstrument($event)"
      (add)="deck.addInstrument()"
      (remove)="deck.removeInstrument($event)"
      (duplicate)="deck.duplicateInstrument($event)"
      (edit)="deck.editInstrument($event)" />
  }
  <section class="relative flex min-h-0 min-w-0 flex-1 flex-col">
    <nc-edge-handle
      class="left-0! z-30!"
      [mark]="folded() ? 'chevron-right' : 'chevron-left'"
      [label]="folded() ? t('editor.sound.showInstruments') : t('editor.sound.hideInstruments')"
      (pressed)="store.toggleSide('instruments')" />
    @if (deck.instrument(); as inst) {
      <header
        class="flex shrink-0 items-center gap-1 border-b-3 border-line bg-panel px-2 py-[6px]">
        <span
          class="flex h-(--nc-h-md) items-center gap-1"
          [style.color]="deck.palette()[inst.colour]">
          <nc-wave-glyph [type]="inst.osc" [width]="30" />
          <span class="text-body text-ink">{{ inst.name }}</span>
        </span>
        <span class="flex-1"></span>
        <nc-oscilloscope
          class="h-(--nc-h-sm) w-[88px] shrink-0 border-3 border-line"
          [peaks]="deck.peaks"
          [label]="t('editor.sound.liveOut')" />
        <button
          ncButton
          variant="ghost"
          iconOnly
          [attr.aria-label]="t('editor.undo')"
          [ncTooltip]="t('editor.undo')"
          [disabled]="!deck.undo.canUndo()"
          (click)="deck.undo.manager.undo()">
          <nc-icon name="undo" />
        </button>
        <button
          ncButton
          variant="ghost"
          iconOnly
          [attr.aria-label]="t('editor.redo')"
          [ncTooltip]="t('editor.redo')"
          [disabled]="!deck.undo.canRedo()"
          (click)="deck.undo.manager.redo()">
          <nc-icon name="redo" />
        </button>
        <nc-sound-help editor="instruments" />
      </header>
      <div class="min-h-0 flex-1 overflow-y-auto">
        <nc-instrument-inspector
          [inst]="inst"
          [samples]="deck.library.samples()"
          (patched)="deck.library.updateInstrument(inst.id, $event)"
          (sampleChange)="deck.library.setInstrumentSample(inst.id, $event)" />
      </div>
      <nc-key-strip
        class="shrink-0 border-t-3 border-line"
        [label]="t('editor.sound.testKeyboard')"
        (pressed)="press($event)"
        (released)="deck.releaseKey()" />
    } @else {
      <div class="flex flex-1 items-center justify-center">
        <nc-empty-state
          icon="music"
          [title]="t('editor.sound.emptyTitle')"
          [hint]="t('editor.sound.emptyHint')">
          <button ncButton variant="primary" (click)="deck.addInstrument()">
            <nc-icon name="plus" />
            {{ t('editor.sound.addInstrument') }}
          </button>
        </nc-empty-state>
      </div>
    }
  </section>
  <nc-sound-peers window="instruments" />
</ng-container>
