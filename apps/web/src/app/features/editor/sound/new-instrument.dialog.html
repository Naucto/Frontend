<nc-dialog-shell
  *transloco="let t"
  [title]="t('editor.sound.newInstrument')"
  [lead]="t(step() === 'choice' ? 'editor.sound.newInstrumentLead' : 'editor.sound.presetsLead')">
  <div class="h-[min(56vh,420px)]">
    @if (step() === 'choice') {
      <div class="grid h-full grid-cols-2 content-center gap-2 px-2">
        <button
          type="button"
          class="flex cursor-pointer flex-col items-start gap-1 raised-lg p-2 text-left hover:bevel-lit active:bevel-down"
          (click)="step.set('preset')">
          <nc-icon name="music" class="text-gold-ink" />
          <span class="text-ui text-ink">{{ t('editor.sound.fromPreset') }}</span>
          <span class="text-meta leading-[1.5] text-ink-3">
            {{ t('editor.sound.fromPresetHint') }}
          </span>
        </button>
        <button
          type="button"
          class="flex cursor-pointer flex-col items-start gap-1 raised-lg p-2 text-left hover:bevel-lit active:bevel-down"
          (click)="ref.close({ kind: 'custom' })">
          <nc-icon name="sliders" class="text-ink-3" />
          <span class="text-ui text-ink">{{ t('editor.sound.custom') }}</span>
          <span class="text-meta leading-[1.5] text-ink-3">
            {{ t('editor.sound.customHint') }}
          </span>
        </button>
      </div>
    } @else {
      <div class="flex h-full gap-2">
        <div
          role="group"
          [attr.aria-label]="t('editor.sound.families')"
          class="flex w-[104px] shrink-0 flex-col gap-0.5">
          @for (shelfOption of shelves; track shelfOption) {
            <button
              type="button"
              [attr.aria-pressed]="shelf() === shelfOption"
              class="flex h-(--nc-h-sm) shrink-0 cursor-pointer items-center raised-sm px-1 text-left font-mono text-label tracking-tag uppercase active:bevel-down"
              [class]="
                shelf() === shelfOption
                  ? 'bevel-down bevel-lit text-active-ink'
                  : 'bevel-bare text-ink-3 hover:bevel-lit hover:bevel-fill-raised hover:text-active-ink'
              "
              (click)="shelf.set(shelfOption)">
              {{ t('editor.sound.family.' + shelfOption) }}
            </button>
          }
        </div>
        <div
          role="radiogroup"
          [attr.aria-label]="t('editor.sound.presets')"
          class="grid h-full min-w-0 flex-1 grid-cols-2 content-start gap-1 overflow-y-auto pr-0.5">
          @for (preset of shown(); track preset.name) {
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="chosen()?.name === preset.name"
              [attr.aria-label]="preset.name"
              class="flex cursor-pointer flex-col gap-0.75 raised-sm p-1 text-left"
              [class]="chosen()?.name === preset.name ? 'bevel-down bevel-lit' : 'hover:bevel-lit'"
              (click)="choose(preset)">
              <span class="flex w-full items-center gap-1">
                <nc-wave-glyph
                  [type]="preset.settings.osc"
                  [width]="24"
                  [class]="chosen()?.name === preset.name ? 'text-gold-ink' : 'text-ink-3'" />
                <span class="min-w-0 flex-1 truncate text-ui text-ink">{{ preset.name }}</span>
                <svg
                  [attr.width]="graphW"
                  [attr.height]="graphH"
                  [attr.viewBox]="'0 0 ' + graphW + ' ' + graphH"
                  aria-hidden="true"
                  class="shrink-0 text-jade">
                  <polyline
                    [attr.points]="preset.points"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3" />
                </svg>
              </span>
              <span class="text-meta leading-[1.5] text-ink-3">{{ preset.blurb }}</span>
            </button>
          }
        </div>
      </div>
    }
  </div>
  <ng-container footer>
    @if (step() === 'preset') {
      <button ncButton variant="ghost" (click)="step.set('choice')">
        {{ t('editor.sound.back') }}
      </button>
      <span class="flex-1"></span>
    }
    <button ncButton variant="ghost" (click)="ref.close()">
      {{ t('editor.code.cancel') }}
    </button>
    @if (step() === 'preset') {
      <button ncButton variant="primary" [disabled]="!chosen()" (click)="create()">
        {{ t('editor.sound.create') }}
      </button>
    }
  </ng-container>
</nc-dialog-shell>
