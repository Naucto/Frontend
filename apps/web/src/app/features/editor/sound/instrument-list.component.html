<div *transloco="let t" class="flex h-full flex-col">
  <div class="flex h-(--nc-h-bar) items-center border-b-3 border-line px-1.5">
    <span class="label text-ink-3">{{ t('editor.sound.instruments') }}</span>
    <span class="flex-1"></span>
    <button
      ncButton
      variant="ghost"
      size="sm"
      iconOnly
      [attr.aria-label]="t('editor.sound.addInstrument')"
      [ncTooltip]="t('editor.sound.addInstrument')"
      (click)="add.emit()">
      <nc-mark name="plus" />
    </button>
  </div>
  <div
    class="min-h-0 flex-1 overflow-auto"
    role="list"
    [attr.aria-label]="t('editor.sound.instruments')">
    @for (instrument of list(); track instrument.id) {
      <div
        role="listitem"
        tabindex="0"
        [attr.aria-current]="instrument.id === selectedId()"
        class="group flex cursor-pointer items-center gap-1 border-l-3 border-transparent px-[14px] py-[9px] hover:bg-raised aria-[current=true]:border-gold aria-[current=true]:bg-raised"
        [style.color]="palette()[instrument.colour]"
        (mousedown)="$event.preventDefault()"
        (click)="selected.emit(instrument.id)"
        (keydown.enter)="selected.emit(instrument.id)"
        (keydown.space)="$event.preventDefault(); selected.emit(instrument.id)">
        <!-- Inherits the row's colour, which is the instrument's own. -->
        <nc-wave-glyph [type]="instrument.osc" class="mr-1" />
        <div class="min-w-0 flex-1 truncate text-body text-ink">{{ instrument.name }}</div>
        <nc-presence-dots
          class="group-focus-within:hidden group-hover:hidden"
          [peers]="peersOf()(instrument.id)" />
        <span class="hidden shrink-0 group-focus-within:flex group-hover:flex">
          <button
            ncButton
            variant="ghost"
            size="sm"
            iconOnly
            [attr.aria-label]="t('editor.sound.duplicate')"
            [ncTooltip]="t('editor.sound.duplicate')"
            (click)="$event.stopPropagation(); duplicate.emit(instrument.id)">
            <nc-mark name="copy" />
          </button>
          <button
            ncButton
            variant="ghost"
            size="sm"
            iconOnly
            [attr.aria-label]="t('editor.sound.editInstrument')"
            [ncTooltip]="t('editor.sound.editInstrument')"
            (click)="$event.stopPropagation(); edit.emit(instrument.id)">
            <nc-mark name="edit" />
          </button>
          <button
            ncButton
            variant="ghost"
            size="sm"
            iconOnly
            [attr.aria-label]="t('editor.sound.removeInstrument', { name: instrument.name })"
            [ncTooltip]="t('editor.sound.removeInstrument', { name: instrument.name })"
            (click)="$event.stopPropagation(); remove.emit(instrument.id)">
            <nc-mark name="trash" />
          </button>
        </span>
      </div>
    }
  </div>
</div>
