<div *transloco="let t" class="grid h-full grid-cols-[minmax(0,1fr)_auto]">
  <section class="flex min-h-0 min-w-0 flex-col">
    <nc-tabs
      ncLooksOnly
      variant="bar"
      class="shrink-0"
      [tabs]="views()"
      [value]="view()"
      (valueChange)="view.set($event ?? 'details')"
      [label]="t('editor.game.title')" />
    <div class="min-h-0 flex-1 overflow-auto bg-paper px-2.75 py-2.5">
      @switch (view()) {
        @case ('details') {
          <nc-game-details
            [(name)]="name"
            [(summary)]="summary"
            [(description)]="description"
            [tags]="tags()"
            (tagsChange)="setTags($event)" />
        }
        @case ('disk') {
          @if (hidden()) {
            <nc-notice tone="danger" class="mb-2" data-testid="disk-hidden-notice">
              {{ t('editor.game.disk.hidden') }}
              <a actions ncButton variant="ghost" size="sm" routerLink="/settings/standing">
                {{ t('moderation.suspended.why') }}
              </a>
            </nc-notice>
          }
          <nc-game-disk-bench [name]="name()" [ncDisabledScope]="hidden()" />
        }
        @case ('inputs') {
          <nc-game-inputs />
        }
      }
    </div>
  </section>
  <nc-game-publishing [name]="name()" [summary]="summary()" [description]="description()" />
</div>
