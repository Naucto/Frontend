<ng-container *transloco="let t">
  @if (rows().length) {
    <nc-section banded [title]="t('editor.diff.changes')">
      <ul class="max-h-[196px] overflow-y-auto" [attr.aria-label]="t('editor.diff.changes')">
        @for (row of rows(); track row.item.key) {
          <li
            class="flex cursor-pointer items-center gap-1 px-1 py-[6px] hover:bg-raised"
            [class.bg-raised]="row.current"
            tabindex="0"
            (click)="select(row)"
            (keydown.enter)="select(row)">
            <span
              class="pixel-cut flex h-[20px] min-w-[22px] shrink-0 items-center justify-center px-[3px] font-mono text-micro"
              [class]="tone(row)"
              [textContent]="row.tag"></span>
            <span class="min-w-0 flex-1">
              <span
                class="block truncate font-mono text-label text-ink"
                [textContent]="row.title"></span>
              <span
                class="block truncate font-mono text-micro text-ink-3"
                [textContent]="row.detail"></span>
            </span>
            <nc-change-chip [kind]="row.item.kind" />
            @if (diff.mode() === 'review') {
              <nc-hunk-actions
                iconOnly
                [decision]="row.decision"
                (decided)="diff.decide([row.item.key], $event)" />
            }
          </li>
        }
      </ul>
    </nc-section>
  }
</ng-container>
