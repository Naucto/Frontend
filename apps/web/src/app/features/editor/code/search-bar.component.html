<!-- One grid for both rows, so the replace field is as long as the find field above it. -->
<div
  *transloco="let t"
  class="grid grid-cols-[auto_minmax(0,1fr)_auto_auto] items-center gap-1 border-t-3 border-line bg-panel px-1.75 py-1.5">
  <div class="contents">
    <button
      ncButton
      variant="ghost"
      size="sm"
      iconOnly
      [attr.aria-label]="t('editor.code.replaceMode')"
      [attr.aria-expanded]="replacing()"
      (click)="replacing.set(!replacing())">
      <nc-mark [name]="replacing() ? 'chevron-down' : 'chevron-right'" />
    </button>
    <!-- Finding is looking, and stays open where the code may not be written; replacing is not. -->
    <div ncLooksOnly class="contents">
      <input
        #field
        ncInput
        class="min-w-0 font-mono"
        [attr.aria-label]="t('editor.code.find')"
        [placeholder]="t('editor.code.find')"
        autocomplete="off"
        spellcheck="false"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
        (keydown.enter)="next.emit()"
        (keydown.shift.enter)="previous.emit()"
        (keydown.escape)="closed.emit()" />
      <!-- Every button prevents its pointer's default, so the caret stays in the field between two arrows. -->
      <div class="flex items-center gap-1">
        <button
          ncButton
          variant="ghost"
          size="lg"
          iconOnly
          [attr.aria-label]="t('editor.code.previous')"
          (mousedown)="$event.preventDefault()"
          (click)="previous.emit()">
          <nc-icon name="chevron-up" [size]="24" />
        </button>
        <button
          ncButton
          variant="ghost"
          size="lg"
          iconOnly
          [attr.aria-label]="t('editor.code.next')"
          (mousedown)="$event.preventDefault()"
          (click)="next.emit()">
          <nc-icon name="chevron-down" [size]="24" />
        </button>
        <button
          ncButton
          variant="ghost"
          size="lg"
          iconOnly
          [attr.aria-label]="t('editor.code.selectAll')"
          (mousedown)="$event.preventDefault()"
          (click)="selectAll.emit()">
          <nc-icon name="list" [size]="24" />
        </button>
      </div>
      <div class="flex min-w-0 items-center gap-1">
        <nc-checkbox [(checked)]="caseSensitive">{{ t('editor.code.matchCase') }}</nc-checkbox>
        <nc-checkbox [(checked)]="regexp">{{ t('editor.code.regexp') }}</nc-checkbox>
        <nc-checkbox [(checked)]="wholeWord">{{ t('editor.code.wholeWord') }}</nc-checkbox>
        <span class="flex-1"></span>
        <button
          ncButton
          variant="ghost"
          size="sm"
          iconOnly
          [attr.aria-label]="t('editor.code.closeSearch')"
          (click)="closed.emit()">
          <nc-mark name="close" />
        </button>
      </div>
    </div>
  </div>

  @if (replacing()) {
    <div class="contents">
      <span></span>
      <input
        ncInput
        class="min-w-0 font-mono"
        [attr.aria-label]="t('editor.code.replaceWith')"
        [placeholder]="t('editor.code.replaceWith')"
        autocomplete="off"
        spellcheck="false"
        [value]="replace()"
        (input)="replace.set($any($event.target).value)"
        (keydown.escape)="closed.emit()" />
      <div class="flex items-center gap-1">
        <button
          ncButton
          variant="ghost"
          size="lg"
          iconOnly
          [attr.aria-label]="t('editor.code.replaceOne')"
          (mousedown)="$event.preventDefault()"
          (click)="replaceOne.emit()">
          <nc-icon name="edit" [size]="24" />
        </button>
        <button
          ncButton
          variant="ghost"
          size="lg"
          iconOnly
          [attr.aria-label]="t('editor.code.replaceAll')"
          (mousedown)="$event.preventDefault()"
          (click)="replaceEvery.emit()">
          <nc-icon name="repeat" [size]="24" />
        </button>
      </div>
    </div>
  }
</div>
