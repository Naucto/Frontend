<section
  *transloco="let t"
  class="mx-auto mt-6 w-full max-w-[436px] rounded-md border border-line bg-panel px-3.5 pt-3.5 pb-3.25">
  <div class="mb-2 flex items-center gap-1">
    <nc-logo [size]="22" />
    <span class="text-title text-ink">Naucto</span>
  </div>
  @if (expired()) {
    <h1 class="mt-2 text-[22px] leading-[1.2] text-ink">{{ t('auth.reset.expiredTitle') }}</h1>
    <p class="mt-1 mb-3 text-body text-ink-3">{{ t('auth.reset.expired') }}</p>
    <a ncButton variant="primary" size="lg" class="w-full" routerLink="/sign-in">
      {{ t('auth.signIn') }}
    </a>
  } @else {
    <h1 class="mt-2 text-[22px] leading-[1.2] text-ink">{{ t('auth.reset.title') }}</h1>
    <p class="mt-1 mb-3 text-body text-ink-3">{{ t('auth.reset.intro') }}</p>
    <form class="grid gap-2" (ngSubmit)="submit()" novalidate>
      <nc-field [label]="t('auth.reset.newPassword')" for="new-password" [hint]="passwordHint()">
        <input
          ncInput
          id="new-password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          [attr.minlength]="policy()?.minLength ?? null"
          [(ngModel)]="password" />
      </nc-field>
      <button
        ncButton
        variant="primary"
        size="lg"
        type="submit"
        class="mt-1 w-full"
        [disabled]="busy()">
        {{ t('auth.reset.submit') }}
      </button>
    </form>
  }
</section>
