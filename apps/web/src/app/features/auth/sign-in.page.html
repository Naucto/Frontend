<section
  *transloco="let t"
  class="flat-lg bevel-fill-panel mx-auto mt-6 w-full max-w-[436px] px-3.5 pt-3.5 pb-3.25">
  <div class="mb-2 flex items-center gap-1">
    <nc-logo [size]="24" />
    <span class="text-title text-ink">Naucto</span>
  </div>
  <h1 class="mt-2 font-display text-display text-ink">{{ t('auth.insertGame') }}</h1>
  <p class="mt-1 mb-3 text-body text-ink-3">{{ t('auth.tagline') }}</p>

  <nc-sign-in-form [next]="safeNext()" (succeeded)="go()" />
</section>
