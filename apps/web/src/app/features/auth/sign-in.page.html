<section
  *transloco="let t"
  class="flat-lg bevel-fill-panel mx-auto mt-6 w-full max-w-[360px] px-2.5 pt-3 pb-2.5">
  <nc-logo variant="wordmark" [size]="24" />
  <h1 class="mt-2 font-display text-display text-ink">{{ t('auth.insertGame') }}</h1>
  <p class="mt-1 mb-2.5 text-small text-ink-3">{{ t('auth.tagline') }}</p>

  <nc-sign-in-form [next]="safeNext()" (succeeded)="go()" />
</section>
