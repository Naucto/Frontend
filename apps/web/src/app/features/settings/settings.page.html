<section *transloco="let t" class="mx-auto w-full max-w-[1000px]">
  <nc-panel [padded]="false">
    <header class="flex flex-wrap items-center justify-between gap-2 px-2.75 pt-2.75">
      <h1 class="font-display text-display text-ink">{{ t('settings.title') }}</h1>
      <nc-segmented
        [options]="tabs()"
        [value]="current()"
        (valueChange)="go($event)"
        [label]="t('settings.title')" />
    </header>
    <div class="px-2.75 py-2.75">
      @switch (current()) {
        @case ('account') {
          <nc-account-settings />
        }
        @case ('editor') {
          <nc-editor-settings />
        }
        @case ('controls') {
          <nc-controls-settings />
        }
        @case ('privacy') {
          <nc-privacy-settings />
        }
        @case ('standing') {
          <nc-standing-settings />
        }
      }
    </div>
  </nc-panel>
</section>
