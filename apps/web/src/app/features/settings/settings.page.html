<section *transloco="let t" class="mx-auto w-full max-w-[1000px]">
  <h1 class="mb-2 font-display text-display text-ink">{{ t('settings.title') }}</h1>
  <nc-tabs
    [tabs]="tabs()"
    [value]="current()"
    (valueChange)="go($event)"
    [label]="t('settings.title')" />
  <!-- The strip's rule is this frame's top edge: the chosen tab opens into it. -->
  <div
    class="flat-sm bevel-open-t bevel-edge-line-strong bevel-fill-raised px-2.75 py-2.75"
    role="tabpanel">
    @switch (current()) {
      @case ('account') {
        <nc-account-settings />
      }
      @case ('editor') {
        <nc-editor-settings />
      }
      @case ('controls') {
        <nc-controls />
      }
      @case ('privacy') {
        <nc-privacy-settings />
      }
    }
  </div>
</section>
