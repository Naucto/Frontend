<div *transloco="let t" class="grid max-w-[620px] items-start gap-2 sm:grid-cols-2">
  <div class="flat-sm bevel-fill-panel p-1.5">
    <div class="flex items-center justify-between">
      <span
        class="label flex items-center gap-0.5"
        [class]="pad() ? 'text-jade-ink' : 'text-ink-4'">
        <span class="inline-block size-[9px]" [class]="pad() ? 'bg-jade' : 'bg-ink-4'"></span>
        {{ pad() ? t('settings.connected') : t('settings.noPad') }}
      </span>
      <span class="label">{{ t('settings.slot', { n: 1 }) }}</span>
    </div>
    <div class="my-2 flex justify-center">
      <nc-gamepad-art />
    </div>
    <div class="text-center text-body text-ink">{{ pad()?.id ?? '—' }}</div>
    <div class="label text-center">{{ t('settings.pressAny') }}</div>
  </div>

  <!-- The on-screen pad, for the device that has no keyboard and no gamepad. The preview is
       live: both sliders drive the same store the pad itself reads. -->
  <div class="flat-sm bevel-fill-panel p-1.5">
    <div class="mb-1 flex items-center justify-between gap-1">
      <span class="label whitespace-nowrap">{{ t('settings.padLayout') }}</span>
      <button
        ncButton
        variant="ghost"
        iconOnly
        [attr.aria-label]="t('settings.resetDefaults')"
        (click)="padSettings.reset()"
        [disabled]="padSettings.isDefault()">
        <nc-icon name="undo" />
      </button>
    </div>
    <div
      class="flat-sm bevel-fill-inset relative flex h-[84px] items-center justify-between px-1.5"
      [style.opacity]="padSettings.opacity() / 100"
      aria-hidden="true">
      <span class="grid grid-cols-3 grid-rows-3" [style.--nc-preview]="padSettings.scale()">
        <span></span>
        <span
          class="h-[calc(12px*var(--nc-preview,1))] w-[calc(12px*var(--nc-preview,1))] bg-ink-4"></span>
        <span></span>
        <span
          class="h-[calc(12px*var(--nc-preview,1))] w-[calc(12px*var(--nc-preview,1))] bg-ink-4"></span>
        <span
          class="h-[calc(12px*var(--nc-preview,1))] w-[calc(12px*var(--nc-preview,1))] bg-ink-3"></span>
        <span
          class="h-[calc(12px*var(--nc-preview,1))] w-[calc(12px*var(--nc-preview,1))] bg-ink-4"></span>
        <span></span>
        <span
          class="h-[calc(12px*var(--nc-preview,1))] w-[calc(12px*var(--nc-preview,1))] bg-ink-4"></span>
        <span></span>
      </span>
      <span class="flex items-center gap-1" [style.--nc-preview]="padSettings.scale()">
        <span
          class="h-[calc(22px*var(--nc-preview,1))] w-[calc(22px*var(--nc-preview,1))] bg-sky/45"></span>
        <span
          class="h-[calc(24px*var(--nc-preview,1))] w-[calc(24px*var(--nc-preview,1))] bg-hot/50"></span>
      </span>
    </div>
    <div class="mt-1.5 grid grid-cols-[auto_minmax(0,1fr)] items-center gap-x-1.5 gap-y-1">
      <span class="label" aria-hidden="true">{{ t('settings.padSize') }}</span>
      <nc-slider
        hideLabel
        [label]="t('settings.padSize')"
        [min]="60"
        [max]="140"
        [value]="padSettings.size()"
        [readout]="padSettings.size() + '%'"
        (valueChange)="padSettings.setSize($event)" />
      <span class="label" aria-hidden="true">{{ t('settings.padOpacity') }}</span>
      <nc-slider
        hideLabel
        [label]="t('settings.padOpacity')"
        [min]="30"
        [max]="100"
        [value]="padSettings.opacity()"
        [readout]="padSettings.opacity() + '%'"
        (valueChange)="padSettings.setOpacity($event)" />
    </div>
    <p class="mt-1 text-meta leading-[1.6] text-ink-3">{{ t('settings.padHint') }}</p>
  </div>
</div>
