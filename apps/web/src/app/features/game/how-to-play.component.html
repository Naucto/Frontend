<div *transloco="let t">
  <nc-label class="mb-1">{{ t('game.howToPlay') }}</nc-label>
  <dl class="grid gap-y-1.5">
    @for (action of actions(); track action.id) {
      <div class="grid gap-y-0.5">
        <dt class="text-meta text-ink">{{ action.label }}</dt>
        @if (action.description) {
          <dd class="text-meta text-ink-3">{{ action.description }}</dd>
        }
        <dd>
          <nc-action-inputs [inputs]="action.inputs" [twoKeyboards]="twoKeyboards()" />
        </dd>
      </div>
    }
  </dl>
</div>
