<ng-container *transloco="let t">
  <button
    ncButton
    variant="ghost"
    size="bar"
    iconOnly
    [pressed]="open()"
    [ncPopover]="panel"
    popoverAlign="end"
    [(popoverOpen)]="open"
    class="relative"
    [attr.aria-label]="t('notifications.title')">
    <nc-icon name="notification" />
    @if (store.unread() > 0) {
      <span
        class="pointer-events-none absolute top-0 right-0 z-1 inline-flex h-[18px] min-w-[18px] items-center justify-center bg-hot px-[3px] text-label leading-none text-on-hot"
        aria-hidden="true">
        {{ store.unread() }}
      </span>
    }
  </button>
  <ng-template #panel>
    <nc-popover-panel class="w-[360px] max-w-[calc(100vw-28px)]">
      <div class="flex h-[46px] items-center gap-[10px] pr-[8px] pl-[14px]">
        <span class="font-ui text-label tracking-label text-ink uppercase">
          {{ t('notifications.title') }}
        </span>
        @if (store.unread() > 0) {
          <nc-chip tone="hot">{{ store.unread() }}</nc-chip>
        }
        <span class="flex-1"></span>
        <button
          ncButton
          variant="ghost"
          size="sm"
          (click)="store.markAllRead()"
          [disabled]="store.unread() === 0">
          {{ t('notifications.markAllRead') }}
        </button>
      </div>
      <!-- A row is a list option: no frame until it is pointed at, then lit and pressable. One not
           read yet stands on the raised ground. -->
      <ul class="grid max-h-[360px] gap-[3px] overflow-auto px-[6px] pb-[6px]">
        @for (notification of store.items(); track notification.id) {
          <li>
            <button
              type="button"
              class="raised-sm flex w-full cursor-pointer gap-[12px] bevel-edge-transparent bevel-skirt-transparent px-[11px] pt-[8px] pb-[5px] text-left hover:bevel-lit active:bevel-down"
              [class]="notification.read ? 'bevel-fill-transparent' : 'bevel-fill-raised'"
              (click)="act(notification)">
              <span
                class="flat-sm inline-flex h-[30px] w-[30px] shrink-0 items-center justify-center"
                [class]="
                  notification.type === 'WARNING'
                    ? 'bevel-edge-orange text-orange-ink'
                    : 'bevel-edge-sky text-sky-ink'
                "
                aria-hidden="true">
                <nc-icon [name]="notification.type === 'WARNING' ? 'warning-box' : 'info-box'" />
              </span>
              <span class="grid min-w-0 flex-1 gap-[2px]">
                <span class="text-small leading-[1.35] text-ink">{{ notification.title }}</span>
                <span class="text-meta text-ink-2">{{ notification.message }}</span>
                <span class="text-micro tracking-wide text-ink-4 uppercase">
                  {{ notification.createdAt | slice: 0 : 10 }}
                </span>
              </span>
            </button>
          </li>
        } @empty {
          <li class="px-[14px] pt-[22px] pb-[26px] text-center text-body text-ink-3">
            {{ t('notifications.empty') }}
          </li>
        }
      </ul>
    </nc-popover-panel>
  </ng-template>
</ng-container>
