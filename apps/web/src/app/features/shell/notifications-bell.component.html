<ng-container *transloco="let t">
  <button
    ncButton
    variant="ghost"
    size="bar"
    iconOnly
    [ncPopover]="panel"
    popoverAlign="end"
    [(popoverOpen)]="open"
    class="relative"
    [attr.aria-label]="t('notifications.title')">
    <nc-icon
      name="notification"
      [size]="24"
      [class]="store.unread() > 0 ? 'text-gold-ink' : 'text-ink-3'" />
    @if (store.unread() > 0) {
      <span class="absolute top-[4px] right-[4px] h-[8px] w-[8px] bg-hot" aria-hidden="true"></span>
    }
  </button>
  <ng-template #panel>
    <nc-popover-panel class="w-[360px]">
      <div class="flex h-4 items-center gap-1 border-b border-line px-2">
        <span class="label text-ink">{{ t('notifications.title') }}</span>
        @if (store.unread() > 0) {
          <span class="rounded-xs bg-hot px-0.5 font-mono text-[10px] text-on-accent-dark">
            {{ store.unread() }}
          </span>
        }
        <span class="flex-1"></span>
        <button
          ncButton
          variant="ghost"
          size="sm"
          (click)="store.markAllRead()"
          [disabled]="store.unread() === 0">
          {{ t('notifications.markAllRead') }}
        </button>
      </div>
      <ul class="max-h-[360px] overflow-auto">
        @for (notification of store.items(); track notification.id) {
          <li
            class="flex gap-1 border-b border-line px-2 py-1.5 last:border-b-0"
            [class.bg-raised]="!notification.read">
            <span
              class="mt-0.5 w-[2px] shrink-0 self-stretch"
              [class.bg-sky]="notification.type === 'INFO'"
              [class.bg-orange]="notification.type === 'WARNING'"></span>
            <button type="button" class="flex-1 text-left" (click)="act(notification)">
              <div class="text-ui text-ink">{{ notification.title }}</div>
              <div class="text-meta text-ink-2">{{ notification.message }}</div>
              <div class="label mt-0.5 text-ink-4">
                {{ notification.createdAt | slice: 0 : 10 }}
              </div>
            </button>
            @if (!notification.read) {
              <span class="mt-1 h-1 w-1 shrink-0 rounded-xs bg-hot" aria-hidden="true"></span>
            }
          </li>
        } @empty {
          <li class="p-3 text-center text-body text-ink-3">{{ t('notifications.empty') }}</li>
        }
      </ul>
    </nc-popover-panel>
  </ng-template>
</ng-container>
