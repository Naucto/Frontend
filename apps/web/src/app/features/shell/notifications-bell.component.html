<ng-container *transloco="let t">
  <button
    ncButton
    variant="ghost"
    size="bar"
    iconOnly
    [pressed]="open()"
    [ncPopover]="panel"
    popoverAlign="end"
    [(popoverOpen)]="open"
    class="relative"
    [attr.aria-label]="
      store.unread() > 0
        ? t('notifications.titleUnread', { n: store.unread() })
        : t('notifications.title')
    ">
    <nc-icon name="notification" />
    @if (store.unread() > 0) {
      <span
        class="pointer-events-none absolute top-0 right-0 z-1 inline-flex h-[18px] min-w-[18px] items-center justify-center bg-hot px-[3px] text-label leading-none text-on-hot"
        aria-hidden="true">
        {{ store.unread() }}
      </span>
    }
  </button>
  <ng-template #panel>
    <nc-popover-panel
      class="w-[360px] max-w-[calc(100vw-28px)] animate-rise"
      [title]="t('notifications.title')"
      [header]="false">
      <div class="flex h-[46px] items-center gap-[10px] pr-[8px] pl-[14px]">
        <span class="font-ui text-label tracking-label text-ink uppercase">
          {{ t('notifications.title') }}
        </span>
        @if (store.unread() > 0) {
          <nc-chip tone="hot">{{ store.unread() }}</nc-chip>
        }
        <span class="flex-1"></span>
        <button
          ncButton
          variant="ghost"
          size="sm"
          type="button"
          (click)="store.markAllRead()"
          [disabled]="store.unread() === 0">
          {{ t('notifications.markAllRead') }}
        </button>
      </div>
      <ul
        class="grid max-h-[min(420px,calc(100dvh-140px))] gap-[3px] overflow-y-auto px-[6px] pb-[6px]">
        @for (row of rows(); track row.notification.id) {
          @let notification = row.notification;
          <!-- The answers to a request lie over the foot of its row, beside the button rather than
               inside it: a button may not hold another. -->
          <li class="grid">
            <button
              type="button"
              ncOption
              class="col-start-1 row-start-1"
              [class]="row.request ? 'pb-[45px]!' : ''"
              [wash]="notification.read ? undefined : row.tone"
              (click)="act(notification)">
              @if (row.request; as request) {
                <nc-user-avatar
                  [userId]="request.from.id"
                  [name]="request.from.nickname || request.from.username"
                  [size]="30" />
              } @else {
                <span
                  aria-hidden="true"
                  class="inline-flex size-[30px] shrink-0 items-center justify-center"
                  [class]="INK[row.tone]">
                  <nc-icon [name]="row.icon" />
                </span>
              }
              <span class="grid min-w-0 flex-1 gap-[2px]">
                <span
                  class="text-small leading-[1.35]"
                  [class]="notification.read ? 'text-ink' : INK[row.tone]">
                  {{ notification.title }}
                </span>
                <span class="text-meta text-ink-2">{{ notification.message }}</span>
                <span class="text-micro tracking-wide text-ink-4 uppercase">
                  {{ notification.createdAt | ncRelativeTime }}
                </span>
              </span>
              @if (row.invite) {
                <span
                  aria-hidden="true"
                  class="shrink-0 self-center text-meta tracking-button text-jade-ink uppercase">
                  {{ t('net.join.join') }}
                </span>
              }
            </button>
            @if (row.request; as request) {
              <div
                class="pointer-events-none z-1 col-start-1 row-start-1 flex gap-[6px] self-end pb-[9px] pl-[56px] *:pointer-events-auto">
                <button
                  ncButton
                  variant="jade"
                  size="sm"
                  type="button"
                  [disabled]="answering() !== null"
                  (click)="answer(notification.id, request.id, true)">
                  {{ t('friends.accept') }}
                </button>
                <button
                  ncButton
                  size="sm"
                  type="button"
                  [disabled]="answering() !== null"
                  (click)="answer(notification.id, request.id, false)">
                  {{ t('notifications.ignore') }}
                </button>
              </div>
            }
          </li>
        } @empty {
          <li
            class="px-[14px] pt-[22px] pb-[26px] text-center font-ui text-label tracking-label text-ink-3 uppercase">
            {{ t('notifications.empty') }}
          </li>
        }
      </ul>
    </nc-popover-panel>
  </ng-template>
</ng-container>
