<!-- Stacked above the page because the bar opens panels over it; a z-index on a dropdown would only
     order it inside the bar. Above the editor's edge handles, below the toasts. -->
<!-- From md, a grid of mark | nav | search | actions: the search takes the track left between the
     two clusters, so it shrinks before anything overlaps it. Below md the row is menu | mark |
     actions, and the menu button opens the search and the links under it; the header never scrolls
     sideways. -->
<header
  *transloco="let t"
  class="relative z-30 flex min-h-[56px] flex-wrap items-center gap-x-[10px] border-b-3 border-line-strong bg-panel pr-[10px] pl-[6px] md:grid md:h-[56px] md:grid-cols-[auto_auto_minmax(0,1fr)_auto] md:gap-x-[18px] md:pr-[14px] md:pl-[20px]">
  <a routerLink="/hub" class="order-2 flex shrink-0 items-center md:order-none" aria-label="Naucto">
    <nc-logo variant="wordmark" link [size]="18" />
  </a>

  <button
    ncButton
    variant="ghost"
    size="xl"
    iconOnly
    type="button"
    class="order-1 md:hidden"
    [pressed]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="t('nav.main')"
    (click)="menuOpen.set(!menuOpen())">
    <nc-icon [name]="menuOpen() ? 'close' : 'menu'" />
  </button>

  <nav
    class="order-5 w-full pb-[14px] md:order-none md:flex md:w-auto md:items-center md:gap-[22px] md:p-0"
    [class.grid]="menuOpen()"
    [class.hidden]="!menuOpen()"
    [attr.aria-label]="t('nav.main')">
    <a routerLink="/hub" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
      {{ t('nav.hub') }}
    </a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/games" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
        {{ t('nav.myGames') }}
      </a>
      <a routerLink="/friends" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
        {{ t('nav.friends') }}
      </a>
    }
    <a routerLink="/learn" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
      {{ t('nav.learn') }}
    </a>
  </nav>

  <nc-search-suggest
    #search
    class="order-4 w-full max-md:my-[14px] md:order-none md:max-w-[420px] md:justify-self-center"
    [class.max-md:hidden]="!menuOpen()"
    [placeholder]="t('nav.search')"
    [query]="query()" />

  <div
    class="order-3 ms-auto flex items-center justify-end gap-[10px] md:order-none md:ms-0 md:justify-self-end"
    data-testid="top-bar-actions">
    @if (auth.isAuthenticated()) {
      <a
        ncButton
        variant="primary"
        size="lg"
        routerLink="/games/new"
        class="max-sm:aspect-square max-sm:px-0"
        [attr.aria-label]="t('nav.newGame')">
        <nc-icon name="plus" class="sm:hidden" />
        <span class="hidden sm:inline">{{ t('nav.newGame') }}</span>
      </a>
      <nc-report-problem-button class="max-md:hidden" />
      <nc-notifications-bell />
      <nc-account-menu />
    } @else {
      <nc-report-problem-button class="max-md:hidden" />
      <a ncButton variant="primary" size="lg" routerLink="/sign-in">
        {{ t('nav.signIn') }}
      </a>
    }
  </div>
</header>
