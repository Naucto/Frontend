<!-- Stacked above the page because the bar opens panels over it; a z-index on a dropdown would only
     order it inside the bar. Above the editor's edge handles, below the toasts. -->
<!-- From md, a grid of mark | nav | search | actions: the search takes the track left between the
     two clusters, so it shrinks before anything overlaps it. -->
<header
  *transloco="let t"
  class="relative z-30 flex min-h-7 flex-wrap items-center gap-x-0 gap-y-2 border-b border-line bg-panel py-1 pr-2 pl-0 md:grid md:grid-cols-[auto_auto_minmax(0,1fr)_auto] md:gap-x-2 md:py-0"
>
  <a
    routerLink="/hub"
    class="flex w-[81px] shrink-0 items-center justify-center"
    aria-label="Naucto"
  >
    <nc-logo />
  </a>

  <!-- Below md the links collapse behind the menu button; the header never scrolls sideways. -->
  <button
    type="button"
    class="ms-1 inline-flex h-4 w-4 items-center justify-center rounded-xs text-ink-3 hover:text-ink md:hidden"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="t('nav.main')"
    (click)="menuOpen.set(!menuOpen())"
  >
    <nc-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" />
  </button>

  <nav
    class="order-last w-full flex-wrap items-center gap-1 md:order-none md:flex md:w-auto"
    [class.flex]="menuOpen()"
    [class.hidden]="!menuOpen()"
    [attr.aria-label]="t('nav.main')"
  >
    <a routerLink="/hub" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
      {{ t('nav.hub') }}
    </a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/games" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
        {{ t('nav.myGames') }}
      </a>
      <a routerLink="/friends" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
        {{ t('nav.friends') }}
      </a>
    }
    <a routerLink="/learn" routerLinkActive ariaCurrentWhenActive="page" [class]="navLink">
      {{ t('nav.learn') }}
    </a>
  </nav>

  <nc-search-suggest
    #search
    class="ms-2 min-w-0 flex-1 md:ms-0 md:w-full md:max-w-[420px] md:justify-self-center"
    [placeholder]="t('nav.search')"
    [query]="query()"
  />

  <div
    class="ms-2 flex flex-1 items-center justify-end gap-1 md:ms-0 md:justify-self-end"
    data-testid="top-bar-actions"
  >
    @if (auth.isAuthenticated()) {
      <a ncButton variant="primary" size="bar" routerLink="/games/new">
        <nc-icon name="plus" [size]="12" class="sm:hidden" />
        <span class="hidden sm:inline">+ {{ t('nav.newGame') }}</span>
      </a>
      <nc-notifications-bell />
      <nc-account-menu class="ms-1" />
    } @else {
      <a ncButton variant="primary" size="bar" routerLink="/sign-in">
        {{ t('nav.signIn') }}
      </a>
    }
  </div>
</header>
