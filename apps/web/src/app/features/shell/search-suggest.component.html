<ng-container *transloco="let t">
  <nc-search
    #box
    class="w-full"
    [placeholder]="placeholder()"
    [(value)]="text"
    [list]="LIST_ID"
    [expanded]="opened()"
    (click)="opened.set(true)"
    (input)="opened.set(true)"
    (submitted)="search()" />

  <span role="status" aria-live="polite" class="sr-only">
    @if (opened() && !suggestions.isFetching()) {
      {{ count() ? t('search.count', { n: count() }) : t('search.none') }}
    }
  </span>

  <!-- The panel draws disks, which no page needs before somebody reaches for the box. -->
  @defer (when opened(); prefetch on hover(box)) {
    @if (opened()) {
      <nc-search-panel
        [suggestions]="data()"
        [parsed]="parsed()"
        [cursor]="cursor()"
        [listId]="LIST_ID"
        [empty]="count() === 0 && !suggestions.isFetching()"
        (picked)="go($event)" />
    }
  }
</ng-container>
