<!-- No top margin: a page whose own panel runs to the bottom edge has to meet this rule, and
     one that ends on its content is already held off it by the shell's padding. -->
<footer *transloco="let t" class="relative border-t-3 border-line-strong bg-panel">
  <!-- Below md each group folds behind its heading; from md the four columns stand open. -->
  <div
    class="grid max-md:pb-[8px] md:grid-cols-[1.4fr_1fr_1fr_1fr] md:gap-[32px] md:px-[clamp(28px,5vw,100px)] md:py-[44px]">
    <div class="grid content-start gap-[12px] px-[16px] pt-[22px] pb-[14px] md:p-0">
      <nc-logo variant="wordmark" [size]="24" class="justify-self-start" />
      <p class="max-w-[34ch] text-body leading-[1.55] text-ink-2">{{ t('footer.tagline') }}</p>
    </div>

    <ng-template #heading let-group="group" let-title="title">
      <button
        type="button"
        class="flex h-[46px] w-full cursor-pointer items-center justify-between px-[16px] font-ui text-label tracking-label text-ink-3 uppercase hover:text-ink md:hidden"
        [attr.aria-expanded]="open() === group"
        (click)="open.set(open() === group ? null : group)">
        {{ title }}
        <nc-mark [name]="open() === group ? 'chevron-up' : 'chevron-down'" />
      </button>
      <div class="mb-[12px] hidden font-ui text-label tracking-label text-ink-3 uppercase md:block">
        {{ title }}
      </div>
    </ng-template>

    <nav [attr.aria-label]="t('footer.product')">
      <ng-container
        [ngTemplateOutlet]="heading"
        [ngTemplateOutletContext]="{ group: 'product', title: t('footer.product') }" />
      <ul [class]="links" [class.max-md:hidden]="open() !== 'product'">
        <li>
          <a routerLink="/hub" [class]="link">{{ t('nav.hub') }}</a>
        </li>
        <li>
          <a routerLink="/learn" [class]="link">{{ t('nav.learn') }}</a>
        </li>
        <li>
          <a routerLink="/games/new" [class]="link">{{ t('footer.makeGame') }}</a>
        </li>
      </ul>
    </nav>
    <nav [attr.aria-label]="t('footer.community')">
      <ng-container
        [ngTemplateOutlet]="heading"
        [ngTemplateOutletContext]="{ group: 'community', title: t('footer.community') }" />
      <ul [class]="links" [class.max-md:hidden]="open() !== 'community'">
        <li>
          <a routerLink="/friends" [class]="link">{{ t('nav.friends') }}</a>
        </li>
        <li>
          <a href="https://github.com/Naucto" target="_blank" rel="noopener" [class]="link">
            GitHub
          </a>
        </li>
        <li>
          <button type="button" [class]="link" (click)="feedback.rate()">
            {{ t('footer.feedback') }}
          </button>
        </li>
        <li>
          <button type="button" [class]="link" (click)="feedback.reportBug()">
            {{ t('footer.reportBug') }}
          </button>
        </li>
      </ul>
    </nav>
    <nav [attr.aria-label]="t('footer.legal')">
      <ng-container
        [ngTemplateOutlet]="heading"
        [ngTemplateOutletContext]="{ group: 'legal', title: t('footer.legal') }" />
      <ul [class]="links" [class.max-md:hidden]="open() !== 'legal'">
        <li>
          <a
            href="https://github.com/Naucto/Frontend/blob/main/license.txt"
            target="_blank"
            rel="noopener"
            [class]="link">
            GPL-3.0
          </a>
        </li>
        <li>
          <a routerLink="/privacy" [class]="link">{{ t('footer.privacy') }}</a>
        </li>
        <li>
          <a
            href="https://github.com/Naucto/Frontend/security"
            target="_blank"
            rel="noopener"
            [class]="link">
            {{ t('footer.security') }}
          </a>
        </li>
      </ul>
    </nav>
  </div>
</footer>
