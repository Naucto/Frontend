<ng-container *transloco="let t">
  <!-- While the panel is out the avatar stands pressed, ringed in gold. -->
  <button
    type="button"
    [ncPopover]="menu"
    popoverAlign="end"
    [(popoverOpen)]="open"
    class="group flex cursor-pointer items-center"
    [attr.aria-label]="t('account.menu')">
    <nc-avatar
      class="group-hover:bevel-edge-gold group-aria-expanded:translate-y-[3px] group-aria-expanded:bevel-edge-gold"
      colour="neutral"
      [name]="auth.displayName()"
      [src]="avatar()"
      [size]="40" />
  </button>
  <ng-template #menu>
    <nc-popover-panel
      class="w-[320px] max-w-[calc(100vw-28px)] animate-rise"
      [title]="t('account.menu')"
      [header]="false">
      <div class="flex items-center gap-[12px] p-[14px]">
        <nc-avatar [name]="auth.displayName()" [src]="avatar()" [size]="40" />
        <div class="grid min-w-0 gap-[2px]">
          <div class="truncate text-body text-ink">{{ auth.displayName() }}</div>
          <div class="flex gap-1.5">
            <nc-stat icon="grid" [value]="games.data() ?? 0" [label]="t('account.games')" compact />
            <nc-stat
              icon="users"
              [value]="friends.data() ?? 0"
              [label]="t('account.friends')"
              compact />
          </div>
        </div>
      </div>
      <div class="grid gap-[3px] px-[6px] pb-[6px]">
        @if (auth.user()?.username; as username) {
          <a ncOption shape="menu" [routerLink]="['/u', username]" (click)="open.set(false)">
            <nc-icon name="user" />
            {{ t('account.profile') }}
          </a>
        }
        <a ncOption shape="menu" routerLink="/settings" (click)="open.set(false)">
          <nc-icon name="sliders" />
          {{ t('account.settings') }}
        </a>
        <button ncOption shape="menu" type="button" (click)="rate()">
          <nc-icon name="message" />
          {{ t('feedback.rating.menu') }}
        </button>
        <button ncOption shape="menu" type="button" (click)="reportBug()">
          <nc-icon name="bug" />
          {{ t('feedback.bug.title') }}
        </button>
        <button ncOption shape="menu" type="button" (click)="logout()">
          <nc-icon name="logout" />
          {{ t('account.signOut') }}
        </button>
      </div>
    </nc-popover-panel>
  </ng-template>
</ng-container>
