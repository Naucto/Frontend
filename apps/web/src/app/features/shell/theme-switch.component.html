<button
  *transloco="let t"
  ncButton
  variant="ghost"
  size="bar"
  iconOnly
  type="button"
  data-testid="theme-switch"
  [ncTooltip]="t('account.theme')"
  [attr.aria-label]="t('account.theme')"
  (click)="theme.theme.set(theme.effective() === 'dark' ? 'light' : 'dark')">
  <nc-icon [name]="theme.effective() === 'dark' ? 'moon' : 'sun'" />
</button>
