<nc-dialog-shell *transloco="let t" [title]="t('profile.image.' + data.zone)">
  <p class="mt-2 mb-1 flex items-center gap-1">
    <nc-chip>{{ t('profile.image.shape.' + data.zone) }}</nc-chip>
    <span class="label text-ink-4">{{ t('profile.image.spec.' + data.zone) }}</span>
  </p>

  <!-- The well is a wrapper: the crop is measured from the frame's own box, which has no border. -->
  <div class="well">
    <div
      #frame
      class="relative h-[300px] overflow-hidden select-none"
      (dragover)="$event.preventDefault()"
      (drop)="onDrop($event)">
      @if (url(); as src) {
        <img
          #img
          [src]="src"
          alt=""
          class="absolute"
          [style.left.px]="fit().x"
          [style.top.px]="fit().y"
          [style.width.px]="fit().w"
          [style.height.px]="fit().h"
          (load)="reset()" />
        @let selection = crop();
        <!-- Dims the whole image; the clipped copy below redraws the selection undimmed. -->
        <div class="pointer-events-none absolute inset-0 bg-page/65"></div>
        <div
          class="absolute overflow-hidden"
          [style.left.px]="selection.x"
          [style.top.px]="selection.y"
          [style.width.px]="selection.w"
          [style.height.px]="selection.h">
          <img
            [src]="src"
            alt=""
            class="absolute max-w-none"
            [style.left.px]="fit().x - selection.x"
            [style.top.px]="fit().y - selection.y"
            [style.width.px]="fit().w"
            [style.height.px]="fit().h" />
        </div>
        <div
          class="absolute cursor-move border-3 border-gold"
          [style.left.px]="selection.x"
          [style.top.px]="selection.y"
          [style.width.px]="selection.w"
          [style.height.px]="selection.h"
          (pointerdown)="grab($event, 'move')">
          @for (grip of grips; track grip.grip) {
            <span
              class="absolute size-[9px] bg-gold"
              [class]="grip.cursor"
              [style.left]="grip.left"
              [style.top]="grip.top"
              (pointerdown)="grab($event, grip.grip)"></span>
          }
        </div>
      } @else {
        <button
          type="button"
          class="flex h-full w-full flex-col items-center justify-center gap-1 text-ink-3 hover:text-ink-2"
          (click)="file().nativeElement.click()">
          <nc-icon name="image" [size]="24" />
          <span class="text-body">{{ t('profile.image.drop') }}</span>
          <span class="flex items-center gap-0.5">
            @for (format of formats; track format) {
              <nc-chip>{{ format }}</nc-chip>
            }
          </span>
          <span class="label text-ink-4">{{ t('profile.image.limits') }}</span>
          <span ncButton variant="secondary" size="sm" class="mt-1">
            {{ t('profile.image.browse') }}
          </span>
        </button>
      }
    </div>
  </div>

  @if (error(); as error) {
    <nc-notice class="mt-1" tone="danger">{{ error }}</nc-notice>
  }

  <input
    #fileInput
    type="file"
    class="hidden"
    [accept]="accept"
    (change)="onPick($event)"
    [attr.aria-label]="t('profile.image.browse')" />

  <ng-container footer>
    <button ncButton variant="ghost" (click)="ref.close()">
      {{ t('editor.code.cancel') }}
    </button>
    <button ncButton variant="primary" [disabled]="!url() || busy()" (click)="save()">
      {{ t('profile.image.save') }}
    </button>
  </ng-container>
</nc-dialog-shell>
