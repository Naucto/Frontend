<div role="radiogroup" [attr.aria-label]="label()" class="inline-flex items-start">
  @for (item of items(); track item.value; let i = $index) {
    <button
      #radio
      type="button"
      role="radio"
      [attr.aria-checked]="item.value === value()"
      [attr.data-on]="item.value === value() ? '' : null"
      [attr.aria-label]="item.label"
      [attr.tabindex]="tabIndexFor(item, i)"
      [ncTooltip]="item.key ? item.label + ' · ' + item.key : item.label"
      (click)="value.set(item.value)"
      (keydown)="onKey($event, i)"
      [class]="toolClass($first, $last)">
      <!-- The opening is on a wrapper: the cell's own transition belongs to its bevel. -->
      <span
        class="inline-flex h-full items-center justify-center gap-0 px-[10px] transition-[padding,gap] duration-[220ms] ease-[cubic-bezier(0.3,0.8,0.2,1)] group-data-on:gap-[10px] group-data-on:px-[14px]">
        <nc-icon [name]="item.icon" [size]="iconSize()" />
        <span
          aria-hidden="true"
          class="grid grid-cols-[0fr] opacity-0 transition-[grid-template-columns,opacity] duration-[220ms] ease-[cubic-bezier(0.3,0.8,0.2,1)] group-data-on:grid-cols-[1fr] group-data-on:opacity-100">
          <span
            class="min-w-0 overflow-hidden text-body leading-none tracking-button whitespace-nowrap">
            {{ item.label }}
          </span>
        </span>
      </span>
    </button>
  }
</div>
