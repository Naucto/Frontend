<nc-icon name="search" [size]="chrome().glyph" [class]="chrome().icon" />
<input
  #input
  type="search"
  autocomplete="off"
  [placeholder]="placeholder()"
  [value]="value()"
  [attr.aria-label]="placeholder()"
  [attr.role]="list() ? 'combobox' : null"
  [attr.aria-autocomplete]="list() ? 'list' : null"
  [attr.aria-controls]="list()"
  [attr.aria-expanded]="list() ? expanded() : null"
  (input)="onInput($event)"
  (keydown.enter)="submitted.emit(value())"
  class="min-w-0 flex-1 text-ink outline-none placeholder:text-ink-4"
  [class]="chrome().input" />
<!-- The key never shrinks; a placeholder has no ellipsis, so a narrow box needs a placeholder
     written to fit beside it. -->
@if (size() === 'md' && keys().length) {
  <span class="-mt-[3px] flex flex-none items-center gap-[3px]">
    @for (key of keys(); track $index) {
      @if (!$first) {
        <span aria-hidden="true" class="font-mono text-meta text-ink-4">+</span>
      }
      <nc-keycap size="sm">{{ key }}</nc-keycap>
    }
  </span>
}
