<div [class]="frameClass()" role="group" [attr.aria-label]="label() || ariaLabel()">
  @if (!plain()) {
    <button
      type="button"
      [class]="buttonClass()"
      [attr.aria-label]="(label() || ariaLabel()) + ' -' + step()"
      [disabled]="!canLower()"
      (click)="nudge(-1)">
      −
    </button>
    <span aria-hidden="true" class="-mt-[3px] w-[3px] flex-none bg-well"></span>
  }
  <label class="flex min-w-0 flex-1 cursor-text items-center gap-[10px] px-1">
    @if (label()) {
      <span [class]="labelClass()">{{ label() }}</span>
    }
    <!-- Committed on blur and on Enter rather than per keystroke, so a half-typed number is never
         applied. -->
    <input
      type="text"
      inputmode="numeric"
      [attr.aria-label]="label() || ariaLabel()"
      [value]="shown()"
      [attr.placeholder]="placeholder()"
      [style.width.ch]="width()"
      [class]="inputClass()"
      (keydown.enter)="commit($event)"
      (keydown.arrowUp)="nudge(1, $event)"
      (keydown.arrowDown)="nudge(-1, $event)"
      (blur)="commit($event)" />
    @if (unit()) {
      <span aria-hidden="true" [class]="labelClass()">{{ unit() }}</span>
    }
  </label>
  @if (!plain()) {
    <span aria-hidden="true" class="-mt-[3px] w-[3px] flex-none bg-well"></span>
    <button
      type="button"
      [class]="buttonClass()"
      [attr.aria-label]="(label() || ariaLabel()) + ' +' + step()"
      [disabled]="!canRaise()"
      (click)="nudge(1)">
      +
    </button>
  }
</div>
