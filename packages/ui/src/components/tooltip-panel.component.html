<div class="flat-lg bevel-fill-raised" [class]="shape()">
  @if (title(); as heading) {
    <div class="font-display text-ui leading-[1.15]">{{ heading }}</div>
  }
  @for (paragraph of paragraphs(); track $index) {
    <p>
      @for (run of paragraph; track $index) {
        @if (run.code) {
          <code class="bg-inset px-0.5 font-mono text-active-ink">{{ run.text }}</code>
        } @else {
          {{ run.text }}
        }
      }
    </p>
  }
  @if (meta().length) {
    <div
      class="grid gap-[4px] border-t-3 border-current pt-1 text-label leading-[1.4] tracking-tag uppercase">
      @for (line of meta(); track $index) {
        <span>{{ line }}</span>
      }
    </div>
  }
</div>
