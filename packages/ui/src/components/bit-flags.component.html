<div role="group" [attr.aria-label]="label()" class="inline-flex items-start">
  @for (bit of bits; track bit) {
    <button
      type="button"
      role="checkbox"
      [attr.aria-checked]="isSet(bit)"
      [attr.data-on]="isSet(bit) ? '' : null"
      [attr.aria-label]="'Flag ' + bit"
      [disabled]="closed()"
      (click)="toggle(bit)"
      [class]="bitClass(bit, $first, $last)">
      {{ bit }}
    </button>
  }
</div>
