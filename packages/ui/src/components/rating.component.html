<div role="radiogroup" [attr.aria-label]="label()" class="grid grid-cols-10">
  @for (score of scores; track score; let i = $index) {
    <!-- The chosen cell is the one tab stop, or the first cell while none is chosen. -->
    <button
      #cell
      type="button"
      role="radio"
      [class]="scoreClass(score, $first, $last)"
      [attr.aria-checked]="score === value()"
      [attr.data-on]="score === value() ? '' : null"
      [attr.tabindex]="score === value() || (value() === null && score === 1) ? 0 : -1"
      [disabled]="closed()"
      (click)="value.set(score)"
      (keydown)="onKey($event, i)">
      {{ score }}
    </button>
  }
</div>
@if (lowLabel() || highLabel()) {
  <div class="mt-[6px] flex justify-between text-label text-ink-4" aria-hidden="true">
    <span>{{ lowLabel() }}</span>
    <span>{{ highLabel() }}</span>
  </div>
}
