<span class="inline-flex items-start">
  @if (playing()) {
    <button type="button" [class]="first" [attr.aria-label]="pauseLabel()" (click)="paused.emit()">
      <nc-icon name="pause" />
    </button>
  } @else {
    <button type="button" [class]="first" [attr.aria-label]="playLabel()" (click)="started.emit()">
      <nc-icon name="play" class="text-hot-ink" />
    </button>
  }
  @if (rewind()) {
    <button
      type="button"
      [class]="middle"
      [attr.aria-label]="rewindLabel()"
      [disabled]="!canRewind()"
      (click)="rewound.emit()">
      <nc-icon name="prev" />
    </button>
  }
  <button
    type="button"
    [class]="last"
    [attr.aria-label]="stopLabel()"
    [disabled]="!canStop()"
    (click)="stopped.emit()">
    <nc-icon name="stop" />
  </button>
</span>
