<span class="inline-flex items-start">
  @if (playing()) {
    <button type="button" [class]="first" [attr.aria-label]="pauseLabel()" (click)="paused.emit()">
      <nc-icon name="pause" [size]="24" />
    </button>
  } @else {
    <button type="button" [class]="first" [attr.aria-label]="playLabel()" (click)="started.emit()">
      <nc-icon name="play" [size]="24" class="text-hot-ink" />
    </button>
  }
  <button
    type="button"
    [class]="middle"
    [attr.aria-label]="rewindLabel()"
    [disabled]="!canRewind()"
    (click)="rewound.emit()">
    <nc-icon name="prev" [size]="24" />
  </button>
  <button
    type="button"
    [class]="last"
    [attr.aria-label]="stopLabel()"
    [disabled]="!canStop()"
    (click)="stopped.emit()">
    <nc-icon name="stop" [size]="24" />
  </button>
</span>
