<span
  class="flat-sm bevel-fill-inset mb-[6px] flex h-[48px] w-[48px] items-center justify-center"
  [class]="tone() === 'hot' ? 'bevel-edge-hot text-hot-ink' : 'text-ink-4'">
  <nc-icon [name]="icon()" [size]="24" />
</span>
<h3 class="font-display text-title text-ink">{{ title() }}</h3>
@if (hint()) {
  <p class="max-w-[36ch] text-small text-ink-3">{{ hint() }}</p>
}
<ng-content select="[hint]" />
<div class="mt-1 flex flex-col items-center gap-[10px] empty:hidden">
  @if (retryLabel(); as label) {
    <button ncButton variant="secondary" size="lg" (click)="retry.emit()">{{ label }}</button>
  }
  <ng-content />
</div>
