@for (cell of cells(); track cell.slot) {
  <button
    type="button"
    class="group"
    [class.w-full]="fill()"
    [class]="cell.frame + (cell.sinks ? ' enabled:data-on:mt-[3px]' : '')"
    [style.--bv-fill]="cell.colour"
    [attr.aria-label]="cell.slot === null ? noneLabel() : slotLabel() + ' ' + cell.slot"
    [attr.aria-pressed]="value() === cell.slot"
    [attr.data-on]="value() === cell.slot ? '' : null"
    [disabled]="closed()"
    (click)="pick(cell.slot)"
    (keydown)="move($event, $index)">
    <span
      class="flex h-[24px] items-center justify-center text-ink-4 group-enabled:group-data-on:text-active-ink"
      [class]="
        (fill() ? 'w-full ' : 'w-[26px] ') +
        (cell.sinks ? 'group-enabled:group-data-on:h-[21px]' : '')
      ">
      @if (cell.slot === null) {
        <nc-mark name="close" />
      } @else {
        <span [class]="markClass(cell.slot)" [style.background]="cell.ink"></span>
      }
    </span>
  </button>
}
