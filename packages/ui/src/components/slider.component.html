@if (label() && !hideLabel()) {
  <span class="label shrink-0 tracking-tag" [class]="compact() ? 'w-[16px]' : 'w-[72px]'">
    {{ label() }}
  </span>
}
<span class="min-w-0 flex-1" [class]="track">
  <span
    class="absolute inset-y-0 left-0 group-has-[input:disabled]:bg-ink-4"
    [class]="fillClass()"
    [style.width.%]="fill()"></span>
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    (input)="onInput($event)"
    [class]="range" />
  <span [class]="thumbSlot" [style.left.%]="fill()">
    <span [class]="thumb"></span>
  </span>
</span>
@if (readout()) {
  <span
    class="shrink-0 text-right text-meta text-ink-body"
    [class]="compact() ? 'w-[30px]' : 'w-[52px]'">
    {{ readout() }}
  </span>
}
