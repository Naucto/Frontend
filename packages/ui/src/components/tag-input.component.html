<div [class]="well">
  @for (tag of tags(); track tag) {
    <nc-chip kind="tag" [removable]="!disabled()" (removed)="remove(tag)">{{ tag }}</nc-chip>
  }
  <input
    type="text"
    [value]="draft()"
    [placeholder]="prompt()"
    [disabled]="disabled() || tags().length >= max()"
    [attr.aria-label]="placeholder()"
    (input)="draft.set($any($event.target).value)"
    (keydown)="onKey($event)"
    (blur)="commit()"
    class="min-w-[80px] flex-1 font-ui text-small text-ink outline-none placeholder:text-ink-4 disabled:cursor-not-allowed" />
</div>
