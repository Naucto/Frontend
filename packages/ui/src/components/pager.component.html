<button
  ncButton
  variant="ghost"
  size="sm"
  iconOnly
  [attr.aria-label]="previousLabel()"
  (click)="step(-1)">
  <nc-icon name="chevron-left" [size]="12" />
</button>
<span role="tablist" class="flex items-center gap-[6px]" [attr.aria-label]="label()">
  @for (page of pages(); track page) {
    <button
      type="button"
      role="tab"
      class="relative h-[8px] cursor-pointer bg-line-strong transition-[width,background-color] duration-[180ms] ease-out"
      [class]="page === value() ? 'w-[34px]' : 'w-[8px] hover:bg-ink-3'"
      [attr.aria-selected]="page === value()"
      [attr.aria-label]="pageLabel() + ' ' + (page + 1)"
      (click)="value.set(page)">
      @if (page === value()) {
        <span #fill class="absolute inset-0 origin-left bg-primary"></span>
      }
    </button>
  }
</span>
<button
  ncButton
  variant="ghost"
  size="sm"
  iconOnly
  [attr.aria-label]="nextLabel()"
  (click)="step(1)">
  <nc-icon name="chevron-right" [size]="12" />
</button>
