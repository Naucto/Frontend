<!-- Above the CDK overlay wrapper (z-index 1000), not merely above the backdrop: a dialog pane can
     reach this corner, and a toast is often about the dialog that would cover it. -->
<div
  class="pointer-events-auto fixed right-2 bottom-2 z-[1001] flex w-[340px] flex-col gap-1.5"
  aria-live="polite">
  @for (toast of toasts.toasts(); track toast.id) {
    <nc-notice
      dismissible
      [tone]="TONE[toast.tone]"
      [title]="toast.title"
      animate.enter="dither-in"
      animate.leave="dither-out"
      (dismissed)="toasts.dismiss(toast.id)">
      {{ toast.text }}
    </nc-notice>
  }
</div>
