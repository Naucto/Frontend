@if (title()) {
  <header class="flex h-4 items-center justify-between border-b border-line px-2">
    <span class="label" [class.text-gold-ink]="titleTone() === 'gold'">{{ title() }}</span>
    <div class="flex items-center gap-1">
      <ng-content select="[actions]" />
    </div>
  </header>
}
<!-- A flex column, so content can pin something to the bottom edge with mt-auto. -->
<div class="flex min-h-0 flex-1 flex-col" [class.p-2]="padded()">
  <ng-content />
</div>
