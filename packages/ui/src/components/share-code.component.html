<nc-readout [value]="shown()" tone="gold">
  @if (regenerable()) {
    <button
      type="button"
      ncButton
      variant="ghost"
      size="sm"
      iconOnly
      [attr.aria-label]="regenerateLabel()"
      [attr.title]="regenerateLabel()"
      [disabled]="!code()"
      (click)="regenerate.emit()">
      <nc-mark name="sync" />
    </button>
  }
  <button
    type="button"
    ncButton
    variant="ghost"
    size="sm"
    iconOnly
    [attr.aria-label]="copyLabel()"
    [attr.title]="copyLabel()"
    [disabled]="!code()"
    (click)="copied.emit()">
    <nc-mark name="copy" />
  </button>
</nc-readout>
