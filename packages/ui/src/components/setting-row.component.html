@if (icon(); as name) {
  <nc-icon [name]="name" [class]="danger() ? 'text-hot-ink' : 'text-ink-2'" />
}
<div class="min-w-0">
  <div class="text-ui" [class]="danger() ? 'text-hot-ink' : 'text-ink'">{{ title() }}</div>
  @if (hint()) {
    <div class="text-meta text-ink-3">{{ hint() }}</div>
  }
</div>
<div
  class="flex max-w-full flex-wrap items-center justify-end gap-1 max-sm:justify-start"
  [class.max-sm:col-start-2]="icon()">
  <ng-content />
</div>
