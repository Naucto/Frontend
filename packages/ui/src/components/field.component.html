<!-- The row stands as tall as a help dot whether or not it carries one, so two fields side by side
     start their controls on the same line. -->
<div class="mb-1 flex min-h-[18px] items-center justify-between gap-1">
  <label [attr.for]="for()" class="font-ui text-label tracking-label text-ink-3 uppercase">
    {{ label() }}
  </label>
  <span class="flex items-center gap-0.75">
    @if (counter()) {
      <span class="text-label text-ink-4">{{ counter() }}</span>
    }
    <ng-content select="[actions]" />
  </span>
</div>
<ng-content />
@if (error()) {
  <p class="mt-0.75 flex items-center gap-0.75 text-meta text-hot-ink" role="alert">
    <nc-icon name="alert" />
    {{ error() }}
  </p>
} @else if (hint()) {
  <p class="mt-0.75 text-meta text-ink-3">{{ hint() }}</p>
}
