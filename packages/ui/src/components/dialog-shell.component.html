@if (kicker() || dismissible()) {
  <header class="flex h-(--nc-h-xl) items-center justify-between border-b-3 border-line px-2">
    <span class="text-label tracking-label uppercase" [class]="kickerInk()">{{ kicker() }}</span>
    @if (dismissible()) {
      <button
        ncButton
        variant="ghost"
        size="lg"
        iconOnly
        class="-mr-1"
        [attr.aria-label]="closeLabel()"
        (click)="close()">
        <nc-icon name="close" [size]="24" />
      </button>
    }
  </header>
}
<div class="px-2 py-2.5">
  <h2 class="font-display text-title leading-[1.15] text-ink">{{ title() }}</h2>
  @if (lead(); as lead) {
    <p class="mt-1 mb-2 max-w-[62ch] text-small leading-[1.55] text-ink-3">{{ lead }}</p>
  }
  <ng-content />
</div>
<footer class="flex items-center justify-end gap-[10px] px-2 pb-2 empty:hidden">
  <ng-content select="[footer]" />
</footer>
