# Production-style run of the frontend alone (the real stack lives in Production-Environment).
networks:
  naucto:
    name: naucto
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - npm_token
    environment:
      APP_API_URL: ${APP_API_URL:-http://localhost:3000}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      APP_GOOGLE_REDIRECT_URI: ${APP_GOOGLE_REDIRECT_URI:-}
      APP_GITHUB_CLIENT_ID: ${APP_GITHUB_CLIENT_ID:-}
      APP_GITHUB_REDIRECT_URI: ${APP_GITHUB_REDIRECT_URI:-}
      APP_MICROSOFT_CLIENT_ID: ${APP_MICROSOFT_CLIENT_ID:-}
      APP_MICROSOFT_TENANT_ID: ${APP_MICROSOFT_TENANT_ID:-common}
      APP_MICROSOFT_REDIRECT_URI: ${APP_MICROSOFT_REDIRECT_URI:-}
    ports:
      - '3001:80'
    networks:
      - naucto

secrets:
  npm_token:
    environment: NPM_TOKEN
